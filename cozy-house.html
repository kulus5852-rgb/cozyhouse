        m.position.set(cx + 0.22 + dx, 0.764 + dy, cz + dz); m.scale.y = col === 0xd9b53a ? 0.75 : 0.92; S.add(m);
      }
      PR.vase({ parent: S, position: [cx + 0.55, 0.76, cz + 0.08], flowers: 'daisy', height: 0.15, color: 0xefe6d4, seed: 91 });
      for (const [px, pz] of [[cx - 0.4, cz - 0.28], [cx + 0.4, cz + 0.28]]) {
        U.cyl(S, 0.12, 0.1, 0.014, M.ceramic, px, 0.767, pz, { radial: 28 });
        PR.mug({ parent: S, position: [px + 0.17, 0.76, pz], color: 0xefe6d4, fill: 'none', rotationY: 0.8 });
      }
      const chairs = [[cx - 0.4, cz - 0.82, 0.05], [cx + 0.4, cz - 0.8, -0.08], [cx - 0.4, cz + 0.82, PI - 0.06], [cx + 0.4, cz + 0.8, PI + 0.04]];
      for (const [x, z, ry] of chairs) {
        buildChair(S, M, x, z, ry);
        addBox(x - 0.24, 0, z - 0.24, x + 0.24, 0.95, z + 0.24, 'chair');
      }
      const cp = proxyBox(D, hidden, -0.23, 0, -0.23, 0.23, 0.95, 0.23, 'kitchen.diningChair.pick');
      cp.position.set(cx + 0.4, 0.475, cz + 0.8); cp.rotation.y = PI + 0.04;
      C.interact.add({ id: 'dining_chair', object: cp, label: 'Sit at the table', onUse: () => C.player.sitAt(st.seat) });
      PR.lamp({ id: 'lamp_dining_pendant', type: 'pendant', style: 'dome', position: [cx, 2.8, cz], height: 1.02, intensity: 5.2, color: 0xffc27a, room: 'kitchen', parent: D, label: 'pendant lamp' });
      PR.lamp({ id: 'lamp_kitchen', type: 'pendant', style: 'glass', position: [-1.9, 2.8, -3.55], height: 0.68, intensity: 3.2, color: 0xffd29a, room: 'kitchen', parent: D, label: 'kitchen light' });
      PR.plant({ parent: S, type: 'monstera', position: [-6.2, 0, -0.35], scale: 0.9, seed: 92 });
      P.addCylinder(-6.2, -0.35, 0.22, 0, 1.0, { tag: 'furniture', name: 'kitchen.monstera' });
      PR.painting({ parent: S, width: 0.55, height: 0.42, style: 'cottage', frame: 'wood', position: [-6.75, 1.6, -0.4], rotationY: PI / 2, seed: 93 });
      PR.painting({ parent: S, width: 0.4, height: 0.5, style: 'botanical', frame: 'gold', position: [1.925, 1.55, -1.5], rotationY: -PI / 2, seed: 94 });
    });

    // -------------------------------------------------------------------------------------------------------------
    // Mug in hand (parented to the camera) + a pool of mugs that can be set down
    // -------------------------------------------------------------------------------------------------------------
    section('mug', () => {
      const held = new THREE.Group(); held.name = 'kitchen.heldMug'; held.visible = false; held.userData.dynamic = true;
      held.position.copy(HELD_REST);
      held.scale.setScalar(0.85);
      C.camera.add(held);
      const mg = PR.mug({ parent: held, position: [0, 0, 0], color: 0xefe6d4, steam: true, fill: 'tea', rotationY: -0.5 });
      mg.traverse(o => { o.userData.dynamic = true; o.raycast = () => {}; });
      st.held = held; st.heldSteam = mg.userData.steam; st.holding = false; st.sip = 0; st.sips = 0;
      st.pool = [];
      for (let i = 0; i < 4; i++) {
        const m = PR.mug({ parent: D, position: [0, -10, 0], color: [0xefe6d4, 0x8fa487, 0xc98f8a, 0x4f6d9a][i], steam: true, fill: 'tea' });
        m.visible = false;
        st.pool.push({ g: m, steam: m.userData.steam, t: 0 });
      }
      st.poolNext = 0;
      st.ray = new THREE.Raycaster();
      C.input.onKey('KeyQ', () => sip());
      C.input.onKey('KeyE', () => { if (st.holding && !C.interact.focused && st.lastMode !== 'sit') putDown(); });
      C.renderer.domElement.addEventListener('mousedown', e => {
        if (e.button === 0 && st.holding && C.state.started && !C.state.paused && C.input.pointerLocked && !C.interact.focused) sip();
      });
    });

    function giveMug() {
      if (!st.held) return;
      st.holding = true; st.sips = 0; st.sip = 0;
      st.held.visible = true;
      st.heldSteam && st.heldSteam.setStrength(1);
      C.hud.toast('A fresh cup of tea.  Q or click to sip · E to set it down', 4.5);
    }
    function sip() {
      if (!st.holding || st.sip > 0 || C.state.paused) return;
      st.sip = 0.0001; st.sips++;
      C.audio.play('sip', { volume: 0.7 });
      if (st.sips === 1) C.hud.toast('Mmm. Just right.', 2.5);
      if (st.sips >= 7) { C.hud.toast('The last sip. Lovely.', 3); st.finish = true; }
    }
    function putDown() {
      if (!st.holding) return;
      const cam = C.camera;
      cam.getWorldPosition(_v); cam.getWorldDirection(_d);
      st.ray.set(_v, _d); st.ray.far = 2.2;
      const targets = ['living', 'kitchen', 'hallstudy', 'loft', 'house', 'outdoor'].map(n => C.scene.getObjectByName(n)).filter(Boolean);
      let spot = null;
      for (const h of st.ray.intersectObjects(targets, true)) {
        const o = h.object, m = o.material;
        if (!o.isMesh || !h.face || !m || Array.isArray(m) || m.visible === false || m.transparent || !o.visible) continue;
        _n.copy(h.face.normal).transformDirection(o.matrixWorld);
        if (_n.y < 0.75) break;
        spot = h.point; break;
      }
      st.holding = false; st.held.visible = false; st.sip = 0;
      if (!spot || st.finish) {
        C.hud.toast(st.finish ? 'You finish your tea.' : 'You finish your tea.', 2.5);
        st.finish = false;
        return;
      }
      const p = st.pool[st.poolNext]; st.poolNext = (st.poolNext + 1) % st.pool.length;
      p.g.position.set(spot.x, spot.y + 0.001, spot.z);
      p.g.rotation.y = Math.random() * PI * 2;
      p.g.visible = true; p.t = 90;
      p.steam && p.steam.setStrength(Math.max(0.2, 1 - st.sips / 7));
      C.audio.play('clink', { x: spot.x, y: spot.y, z: spot.z, volume: 0.5 });
    }
    st.putDown = putDown;
    st.giveMug = giveMug;

    C.kitchen = { seat: st.seat, tea: { get state() { return st.tea && st.tea.state; }, get holding() { return !!st.holding; }, giveMug, sip, putDown } };
    U.bakeStatic(S);
    st.ready = !!st.tea;
  },

  update(dt, t, C) {
    if (!st.ready) return;
    const cp = C.camera.position;
    // hidden from the loft, and from the study while the kitchen–study door is shut
    const hd = C.house && C.house.doors;
    const inStudy = cp.x > 2.0 && cp.z < -0.7 && hd && doorShut(hd.kitchenStudy);
    st.S.visible = !(cp.x > -7 && cp.x < 7 && cp.z > -5 && cp.z < 5) || (cp.y < 3.8 && !inStudy);
    const tea = st.tea;
    if (tea.state === 'boiling') {
      tea.t += dt;
      if (!tea.heard && tea.t > 6.8) tea.state = 'ready';         // no audio module → no whistle event
    }
    const want = tea.state === 'boiling' ? Math.min(0.7, 0.1 + tea.t * 0.1) : tea.state === 'ready' ? 1 : 0;
    const cur = st.steam.strength !== undefined ? st.steam.strength : 0;
    const nxt = C.util.damp(cur, want, want > cur ? 1.5 : 0.6, dt);
    if (Math.abs(nxt - cur) > 0.002) st.steam.setStrength(nxt);
    st.lastMode = C.player.mode;
    if (st.held && st.holding) {
      if (st.sip > 0) {
        st.sip += dt;
        const ph = Math.min(1, st.sip / 1.5), k = Math.sin(ph * PI);
        st.held.position.lerpVectors(HELD_REST, HELD_SIP, k);
        st.held.rotation.x = k * 0.85;
        if (ph >= 1) { st.sip = 0; if (st.finish) st.putDown(); }
      } else {
        st.held.position.y = HELD_REST.y + Math.sin(t * 1.6) * 0.004;
      }
    }
    for (let i = 0; i < st.pool.length; i++) {
      const p = st.pool[i];
      if (p.t > 0) { p.t -= dt; if (p.steam) p.steam.setStrength(Math.max(0, Math.min(p.steam.strength, p.t / 90))); }
    }
  },
});

</script>
<script type="module" data-module="hallstudy">
// =====================================================================================================================
//  HALL + STUDY — module "hallstudy", order 60.  (SPEC §4.3, §8, §9 hallstudy)
//  Hall: grandfather clock (swinging pendulum, real-time hands, chime), console table + lamp + key bowl + mirror,
//  coat pegs with coats / scarf / hat, bench under the hall window with wellies, umbrella stand dripping into a tray,
//  runner rug, plant, pictures.
//  Study: desk under w_study_n (typewriter, open journal, ink, papers, banker's lamp), captain's desk chair,
//  floor-to-ceiling bookshelves on P1, leather reading chair by the east window, globe, map chest, framed maps,
//  kilim rug, plants, cat bed.
//  Interactables: clock, lamp_hall, lamp_study_desk, desk_chair.  Lights: lamp_hall (Point 2.6 cd), lamp_study_desk
//  (Spot 3.5 cd); both decay 1.5 so the wall / papers right next to them do not blow out.
//  Exposes C.hallstudy = { catBed, seat }.
// =====================================================================================================================
import * as THREE from 'three';

const C = window.COZY;
const PI = Math.PI;
const CLOCK_PHRASES = ['Time for another cup of tea.', 'The rain shows no sign of stopping.', 'No need to be anywhere.',
  'Just right for a nap by the fire.', 'The cat would say it is dinner time.', 'The afternoon is stretching out nicely.'];

const st = { ready: false };

function proxyBox(parent, mat, x0, y0, z0, x1, y1, z1, name) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.name = name;
  m.userData.dynamic = true;
  parent.add(m);
  return m;
}

function group(parent, name, x, y, z, ry) {
  const g = new THREE.Group();
  g.name = name;
  g.position.set(x, y, z);
  g.rotation.y = ry || 0;
  parent.add(g);
  return g;
}

// tall bookshelf in local space: back at z = 0, front at z = D, facing +Z; `slots(level, bay)` may return decor
function buildShelves(parent, M, x, z, ry, W, D, H, levels, bays, seed, decor) {
  const U = C.util, P = C.props;
  const g = group(parent, 'hallstudy.shelves', x, 0, z, ry);
  const t = 0.03, wood = M.dark;
  U.boxAt(g, -W / 2, 0, 0, -W / 2 + t, H, D, wood);
  U.boxAt(g, W / 2 - t, 0, 0, W / 2, H, D, wood);
  U.boxAt(g, -W / 2 - 0.02, H, 0, W / 2 + 0.02, H + 0.05, D + 0.03, wood, { round: 0.008 });
  U.boxAt(g, -W / 2 + t, 0, D - 0.025, W / 2 - t, 0.09, D - 0.005, wood);
  U.boxAt(g, -W / 2 + t, 0.09, 0, W / 2 - t, H, 0.012, M.oak);
  const bw = (W - 2 * t - (bays - 1) * 0.025) / bays;
  for (let b = 1; b < bays; b++) { const cx = -W / 2 + t + b * bw + (b - 0.5) * 0.025; U.boxAt(g, cx - 0.0125, 0.09, 0.012, cx + 0.0125, H, D, wood); }
  for (const y of levels) U.boxAt(g, -W / 2 + t, y, 0.012, W / 2 - t, y + 0.025, D, wood);
  let k = 0;
  for (let li = 0; li < levels.length; li++) for (let b = 0; b < bays; b++) {
    const y = levels[li] + 0.025, cx = -W / 2 + t + b * (bw + 0.025) + bw / 2;
    const d = decor && decor(li, b);
    if (d) {
      P.books({ parent: g, length: bw * 0.55, depth: 0.2, position: [cx - bw * 0.2, y, D - 0.13], seed: seed * 31 + (k++) });
      const px = cx + bw * 0.3, pz = D * 0.55;
      if (d === 'plant') P.plant({ parent: g, type: 'succulent', position: [px, y, pz], seed: seed + k });
      else if (d === 'frame') P.frame({ parent: g, position: [px, y, pz], rotationY: -0.2, w: 0.12, h: 0.16, seed: seed + k });
      else if (d === 'stack') P.bookStack({ parent: g, count: 3, position: [px, y, pz], rotationY: 0.3, seed: seed + k });
      else if (d === 'vase') P.vase({ parent: g, position: [px, y, pz], flowers: false, height: 0.18, shape: 'bottle', color: 0x7a8f6a, seed: seed + k });
      else if (d === 'candle') P.candle({ parent: g, position: [px, y, pz], height: 0.1, radius: 0.03, holder: 'saucer' });
    } else {
      P.books({ parent: g, length: bw - 0.03, depth: 0.2, position: [cx, y, D - 0.13], seed: seed * 31 + (k++), fill: 0.82 + ((k * 37) % 17) / 100 });
    }
  }
  U.blobShadow(g, 0, 0, D * 0.5, W + 0.15, D + 0.2, 0.35);
  return g;
}

C.register({
  name: 'hallstudy',
  order: 60,
  init(C) {
    const U = C.util, P = C.physics, PR = C.props;
    const root = new THREE.Group(); root.name = 'hallstudy';
    C.scene.add(root);
    const S = new THREE.Group(); S.name = 'hallstudy.static'; root.add(S);
    st.S = S;
    const D = new THREE.Group(); D.name = 'hallstudy.dynamic'; D.userData.dynamic = true; root.add(D);
    const hidden = new THREE.MeshBasicMaterial({ visible: false });
    const section = (name, fn) => {
      try { fn(); } catch (e) {
        C.debug.errors.push({ module: 'hallstudy', phase: 'init:' + name, message: e.message, stack: String(e.stack || '').slice(0, 1500) });
        console.error(`[hallstudy] ${name} failed: ${e.message}`);
      }
    };
    const M = {
      dark: C.mat('woodDark'), oak: C.mat('woodMedium'), light: C.mat('woodLight'), cream: C.mat('woodPainted'), brass: C.mat('brass'),
      iron: C.mat('ironBlack'), chrome: C.mat('chrome'), ceramic: C.mat('ceramic'), blue: C.mat('ceramicBlue'), paper: C.mat('paper'),
      leather: C.mat('leather'), navy: C.mat('fabricBlue'), rose: C.mat('fabricRose'), green: C.mat('fabricGreen'), cream2: C.mat('fabricCream'),
      knit: C.mat('knit'), glass: C.mat('glassClear'),
      slicker: U.stdMat(0xd9a52e, 0.38, 0), welly: U.stdMat(0x2f4a36, 0.32, 0), wellyY: U.stdMat(0xd9a52e, 0.32, 0),
      water: U.stdMat(0x9fb4bc, 0.04, 0.1, { transparent: true, opacity: 0.55, depthWrite: false }),
      inkGlass: U.stdMat(0x1b2230, 0.08, 0.1), typer: U.stdMat(0x1d1f22, 0.3, 0.35), keyCap: U.stdMat(0xe9e2d0, 0.4, 0),
    };
    const addBox = (x0, y0, z0, x1, y1, z1, name) => P.addBox([x0, y0, z0], [x1, y1, z1], { tag: 'furniture', name: 'hallstudy.' + name });

    // -------------------------------------------------------------------------------------------------------------
    // Grandfather clock at (2.25, 0, −0.3) against P1, facing +X
    // -------------------------------------------------------------------------------------------------------------
    section('clock', () => {
      const g = group(S, 'hallstudy.grandfatherClock', 2.25, 0, -0.3, PI / 2);
      const w = M.dark;
      U.box(g, 0.5, 0.42, 0.3, w, 0, 0.21, 0, { round: 0.01 });
      U.box(g, 0.54, 0.05, 0.33, w, 0, 0.44, 0.005, { round: 0.012 });
      // hollow trunk so the pendulum shows through the glass door
      U.box(g, 0.4, 1.02, 0.02, w, 0, 0.97, -0.125);
      for (const s of [-1, 1]) U.box(g, 0.03, 1.02, 0.25, w, s * 0.185, 0.97, -0.01);
      U.box(g, 0.4, 0.1, 0.25, w, 0, 0.51, -0.01);
      U.box(g, 0.4, 0.08, 0.25, w, 0, 1.44, -0.01);
      U.box(g, 0.5, 0.05, 0.31, w, 0, 1.5, 0, { round: 0.012 });
      U.box(g, 0.48, 0.52, 0.29, w, 0, 1.78, 0, { round: 0.01 });
      U.box(g, 0.54, 0.06, 0.33, w, 0, 2.07, 0.005, { round: 0.015 });
      const bonnet = new THREE.Shape();
      bonnet.moveTo(-0.26, 0); bonnet.lineTo(0.26, 0); bonnet.lineTo(0.26, 0.05);
      bonnet.quadraticCurveTo(0.14, 0.05, 0.08, 0.14); bonnet.quadraticCurveTo(0, 0.2, -0.08, 0.14); bonnet.quadraticCurveTo(-0.14, 0.05, -0.26, 0.05);
      const bg = new THREE.ExtrudeGeometry(bonnet, { depth: 0.3, bevelEnabled: false });
      bg.translate(0, 2.1, -0.15); U.worldUV(bg, 1);
      const bm = new THREE.Mesh(bg, w); g.add(bm);
      for (const sx of [-0.23, 0, 0.23]) U.sphere(g, 0.025, M.brass, sx, sx ? 2.19 : 2.34, 0.1, { w: 10, h: 8 });
      // dial (real time hands are dynamic)
      const face = U.canvasTexture(256, 256, (ctx, W, H) => {
        ctx.fillStyle = '#efe4c8'; ctx.fillRect(0, 0, W, H);
        const gr = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, 140); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(90,60,20,0.35)');
        ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, H / 2, 112, 0, PI * 2); ctx.stroke();
        ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(W / 2, H / 2, 86, 0, PI * 2); ctx.stroke();
        ctx.fillStyle = '#2a1d12'; ctx.font = 'bold 22px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const R = ['XII', 'I', 'II', 'III', 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
        for (let i = 0; i < 12; i++) { const a = i / 12 * PI * 2; ctx.fillText(R[i], W / 2 + Math.sin(a) * 99, H / 2 - Math.cos(a) * 99); }
        for (let i = 0; i < 60; i++) { const a = i / 60 * PI * 2; ctx.fillRect(W / 2 + Math.sin(a) * 84 - 1, H / 2 - Math.cos(a) * 84 - 1, 2, 2); }
        ctx.font = 'italic 13px Georgia'; ctx.fillText('Hartley & Sons', W / 2, H / 2 + 42);
      }, { wrap: false });
      const dialMat = new THREE.MeshStandardMaterial({ map: face, roughness: 0.6 });
      dialMat.name = 'hallstudy.dial';
      const dial = new THREE.Mesh(new THREE.CircleGeometry(0.17, 40), dialMat);
      dial.position.set(0, 1.8, 0.146); g.add(dial);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.175, 0.012, 8, 40), M.brass);
      ring.position.set(0, 1.8, 0.148); g.add(ring);
      const dg = group(D, 'hallstudy.clockDynamic', 2.25, 0, -0.3, PI / 2);
      const hand = (len, wid) => { const p = new THREE.Group(); p.position.set(0, 1.8, 0.153); dg.add(p); U.box(p, wid, len, 0.004, M.iron, 0, len / 2 - 0.02, 0); return p; };
      st.hourHand = hand(0.1, 0.012); st.minHand = hand(0.145, 0.008);
      U.sphere(dg, 0.01, M.brass, 0, 1.8, 0.158, { w: 8, h: 6 });
      // pendulum behind the glass trunk door
      const pend = new THREE.Group(); pend.position.set(0, 1.44, 0.02); dg.add(pend);
      U.box(pend, 0.012, 0.72, 0.006, M.brass, 0, -0.36, 0);
      U.cyl(pend, 0.07, 0.07, 0.014, M.brass, 0, -0.74, 0, { rx: PI / 2, radial: 28 });
      st.pendulum = pend;
      const glassDoor = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.82), M.glass);
      glassDoor.position.set(0, 0.98, 0.117); glassDoor.name = 'hallstudy.clockGlass'; dg.add(glassDoor);
      U.box(g, 0.32, 0.03, 0.012, w, 0, 0.56, 0.118); U.box(g, 0.32, 0.03, 0.012, w, 0, 1.4, 0.118);
      U.box(g, 0.03, 0.84, 0.012, w, -0.155, 0.98, 0.118); U.box(g, 0.03, 0.84, 0.012, w, 0.155, 0.98, 0.118);
      U.box(g, 0.3, 0.86, 0.01, U.stdMat(0x1a120c, 0.8), 0, 0.98, -0.12);
      U.blobShadow(S, 2.25, 0.004, -0.3, 0.45, 0.65, 0.45);
      addBox(2.075, 0, -0.57, 2.42, 2.4, -0.03, 'clock');
      const tellTime = () => {
        const d = new Date(), h = d.getHours(), m = d.getMinutes();
        const hh = ((h + 11) % 12) + 1, mm = String(m).padStart(2, '0');
        C.hud.toast(`It's ${hh}:${mm} ${h < 12 ? 'in the morning' : h < 18 ? 'in the afternoon' : 'in the evening'}. ${CLOCK_PHRASES[(h * 7 + m) % CLOCK_PHRASES.length]}`, 4);
        C.audio.play('chime', { x: 2.35, y: 1.8, z: -0.3 });
      };
      C.interact.add({ id: 'clock', object: proxyBox(D, hidden, 2.1, 0, -0.56, 2.42, 2.4, -0.04, 'hallstudy.clock.pick'), label: 'Check the time', onUse: tellTime });
      st.lastSec = -1;
    });

    // -------------------------------------------------------------------------------------------------------------
    // Hall: console + lamp + mirror, coat pegs, bench + wellies, umbrella stand + drips, runner, plant, pictures
    // -------------------------------------------------------------------------------------------------------------
    section('console', () => {
      const x0 = 2.08, x1 = 2.42, z0 = 0.55, z1 = 1.28;
      U.boxAt(S, x0, 0.76, z0, x1, 0.8, z1, M.oak, { round: 0.008 });
      U.boxAt(S, x0 + 0.02, 0.66, z0 + 0.03, x1 - 0.02, 0.76, z1 - 0.03, M.oak);

  update(dt, t, C) {

    if (st.minHand) {
      const d = new Date(), s = d.getSeconds();
      if (s !== st.lastSec) {
        st.lastSec = s;

    if (st.drips) {
      for (let i = 0; i < st.drips.length; i++) {

          d.ripple.position.set(d.x, 0.0165, d.z);

      }

});

}

  const g = new THREE.Group();

  parent.add(g);
  return g;
}

    function mergeAll(list) {
      const base = list.map(g => { const n = g.index ? g.toNonIndexed() : g; for (const k of Object.keys(n.attributes)) if (k !== 'position' && k !== 'normal') n.deleteAttribute(k); return n; });
      let count = 0; for (const g of base) count += g.attributes.position.count;
      const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3);
      let o = 0;
      for (const g of base) { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; }
      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      out.computeBoundingSphere();
      return out;

  update(dt, t, C) {
    if (!st.ready) return;
    // from the ground floor the loft is only visible up the stairwell (hall / stairs)
    const cp = C.camera.position;
    st.S.visible = !(cp.x > -7 && cp.x < 7 && cp.z > -5 && cp.z < 5) || cp.y > 2.2 || (cp.x > 2.0 && cp.z > -0.75);
    const want = st.stringOn ? 1 : 0;
    if (st.stringLevel !== want) {
      st.stringLevel += Math.sign(want - st.stringLevel) * Math.min(Math.abs(want - st.stringLevel), dt / 0.2);

      // camera position in cat space → yaw/pitch offsets for the head (relative to the alert pose facing)
      vA.copy(C.camera.position); catG.worldToLocal(vA);
      vA.sub(HEAD_ALERT_C);
      const yaw = Math.atan2(vA.x, vA.z) - HEAD_ALERT_E.y;
      const pitch = -Math.atan2(vA.y, Math.hypot(vA.x, vA.z));
      S.yawT = U.clamp(yaw, -0.9, 0.9) * amount; S.pitchT = U.clamp(pitch, -0.5, 0.35) * amount;
    }

    C.cat = {
      get spot() { return S.spot ? S.spot.name : null; },
      spots: spots.map(s => ({ name: s.name, position: [s.x, s.y, s.z], rotationY: s.ry, source: s.src, surfaceY: s.ySurf ?? null, declaredY: s.yOrig ?? s.y })),
      relocate, pet, root, state: S,
      lookAround() { startLook(C.time); },
      _seen: spotSeen,
    };

    this._S = S; this._upd = { bBody, bHead, tailBones, tailAxes, earBones, earRest, eyeOpenB, sleepB, happyB, qRest, qAlert, pRest, pAlert, qA, qB, eA, vA, vB, Y_AXIS, Z_AXIS, X_AXIS, breathPh, startLook, aimAtPlayer, spotSeen, pickSpot, relocate, rnd, catWorld, _cp };
    C.log('cat', 'spots', spots.map(s => s.name + '@' + s.y.toFixed(3)).join(', '));
  },

  update(dt, t, C) {
    const S = this._S; if (!S || !S.spot) return;
    const u = this._upd, U = C.util, rnd = u.rnd;
    S.modeT += dt;

    // ---------------- behaviour
    if (S.mode === 'sleep') {
      S.liftT = 0; S.eyeT = 0; S.happyT = 0; S.curlT = 0; S.yawT = 0; S.pitchT = 0;
      if (t > S.nextLook) { u.startLook(t); S.nextLook = t + 40 + rnd() * 70; }
      // player comes close → sometimes peeks at them
      u.catWorld(u._cp);
      const near = u._cp.distanceTo(C.camera.position) < 1.8 && C.state.started;
      if (near && S.nearSince < 0) S.nearSince = t; else if (!near) S.nearSince = -1;
      if (near && S.nearSince > 0 && t - S.nearSince > 1.5 && t - S.lastNearLook > 45) { S.lastNearLook = t; if (rnd() < 0.6) { u.startLook(t); S.aimPlayer = true; } }
    } else if (S.mode === 'look') {
      const T = S.modeT, D = S.lookDur;
      S.liftT = T < D - 1.9 ? 1 : 0;
      S.eyeT = T > 0.9 && T < D - 2.2 ? 0.55 : 0;
      if (T > S.nextLookTarget && T < D - 2.2) {
        S.nextLookTarget = T + 1.6 + rnd() * 1.6;
        if (S.aimPlayer || rnd() < 0.35) u.aimAtPlayer(1); else { S.yawT = (rnd() * 2 - 1) * 0.7; S.pitchT = (rnd() * 2 - 1) * 0.15; }
      }
      if (T > D - 2.2) { S.yawT = 0; S.pitchT = 0; }
      if (T > D) { S.mode = 'sleep'; S.aimPlayer = false; }
    } else if (S.mode === 'pet') {
      const T = S.modeT;
      S.liftT = T < PET_DUR - 1.2 ? 0.62 : 0; S.happyT = T < PET_DUR - 0.8 ? 1 : 0; S.eyeT = 0; S.curlT = T < PET_DUR - 0.5 ? 1 : 0;
      S.yawT = Math.sin(T * 2.1) * 0.16 + 0.05; S.pitchT = -0.12 + Math.sin(T * 1.3) * 0.06;
      if (T > PET_DUR) S.mode = 'sleep';
    }
    if (S.purring && t > S.purrUntil) { C.audio.purr.stop(); S.purring = false; }

    // blinks while awake
    if (S.eyeT > 0.1 && t > S.blinkAt) { S.blink = 1; S.blinkAt = t + 1.4 + rnd() * 2.6; }
    S.blink = Math.max(0, S.blink - dt * 7);

    // ---------------- smoothing
    S.lift = U.damp(S.lift, S.liftT, S.liftT > S.lift ? 2.6 : 1.8, dt);
    S.eye = U.damp(S.eye, S.eyeT, 3.0, dt);
    S.happy = U.damp(S.happy, S.happyT, 6, dt);
    S.curl = U.damp(S.curl, S.curlT, 1.6, dt);
    S.yaw = U.damp(S.yaw, S.yawT, 2.2, dt); S.pitch = U.damp(S.pitch, S.pitchT, 2.2, dt);

    // ---------------- body: breathing (sleep ~22/min, a bit faster when awake), tiny purr rumble
    const bp = t * (S.mode === 'sleep' ? 2.35 : 2.9) + u.breathPh;
    const br = Math.sin(bp) * 0.5 + 0.5, brS = br * br * (3 - 2 * br);
    const rum = S.purring ? Math.sin(t * 150) * 0.0012 : 0;
    u.bBody.scale.set(1 + brS * 0.012, 1 + brS * 0.03 + rum, 1 + brS * 0.02);

    // ---------------- head
    const L = S.lift * S.lift * (3 - 2 * S.lift);
    u.qA.copy(u.qRest).slerp(u.qAlert, L);
    const nuz = S.mode === 'pet' ? Math.sin(S.modeT * 2.6) * 0.14 * S.happy : 0;
    u.eA.set(S.pitch, S.yaw, nuz, 'YXZ'); u.qB.setFromEuler(u.eA);
    u.bHead.quaternion.copy(u.qA).multiply(u.qB);
    u.bHead.position.lerpVectors(u.pRest, u.pAlert, L);
    u.bHead.position.y += brS * 0.0022 * (1 - L);

    // ---------------- ears: random twitches (quick flick back + return), relaxed back while petted
    for (let i = 0; i < 2; i++) {
      if (t > S.nextTwitch[i]) {
        S.twitch[i] = 0; S.twitchDir[i] = rnd() < 0.5 ? 1 : -1;
        S.nextTwitch[i] = t + (rnd() < 0.25 ? 0.35 : 3 + rnd() * 9);
      }
      S.twitch[i] += dt;
      const tw = S.twitch[i] < 0.32 ? Math.sin(S.twitch[i] / 0.32 * Math.PI) : 0;
      const side = i ? -1 : 1;
      u.eA.set(-0.35 * tw * (S.twitchDir[i] > 0 ? 1 : 0.5) - 0.25 * S.happy, side * 0.35 * tw * S.twitchDir[i], side * (0.3 * tw + 0.22 * S.happy), 'XYZ');
      u.qB.setFromEuler(u.eA);
      u.earBones[i].quaternion.copy(u.earRest[i]).multiply(u.qB);
    }

    // ---------------- tail: gentle idle sway + tip flicks + curl when petted
    if (t > S.nextFlick) { S.flick = 0; S.flickAmp = 0.6 + rnd() * 0.6; S.nextFlick = t + (S.mode === 'sleep' ? 5 + rnd() * 10 : 1.5 + rnd() * 3); }
    S.flick += dt;
    const fl = S.flick < 1.1 ? Math.sin(S.flick / 1.1 * Math.PI * 2) * Math.sin(S.flick / 1.1 * Math.PI) * S.flickAmp : 0;
    const flUp = S.flick < 1.1 ? Math.sin(S.flick / 1.1 * Math.PI) * S.flickAmp : 0;
    const sway = Math.sin(t * 0.7 + 1.3) * 0.03;
    for (let k = 0; k < u.tailBones.length; k++) {
      const w = k / (u.tailBones.length - 1); // 0 base .. 1 tip
      const yaw = (fl * 0.28 * w * w + sway * w) * 1 - S.curl * 0.16 * w;
      const lift = -flUp * 0.22 * w * w * w - S.curl * 0.05 * w;
      u.qA.setFromAxisAngle(u.Y_AXIS, yaw);
      u.qB.setFromAxisAngle(u.tailAxes[k], lift);
      u.tailBones[k].quaternion.copy(u.qA).multiply(u.qB);
    }

    // ---------------- eyes: sleep line ◡ / open (half-lidded, slit pupils) / happy ^
    const open = S.eye * (1 - S.blink);
    const showOpen = open > 0.1 && S.happy < 0.5;
    for (let i = 0; i < 2; i++) {
      const o = u.eyeOpenB[i], sl = u.sleepB[i], hp = u.happyB[i];
      if (showOpen) o.scale.set(1, Math.max(0.08, open), 1); else o.scale.setScalar(1e-4);
      const happy = S.happy >= 0.5;
      sl.scale.setScalar(!showOpen && !happy ? 1 : 1e-4);
      hp.scale.setScalar(happy ? 1 : 1e-4);
    }

    // ---------------- relocation (only when both the current and the new spot are unseen)
    if (t > S.nextRelocate && S.mode === 'sleep' && !S.purring) {
      S.nextRelocate = t + 4 + rnd() * 3;
      if (!u.spotSeen(S.spot)) {
        const cand = u.pickSpot();
        const pp = C.player.position;
        if (cand && !u.spotSeen(cand) && Math.hypot(pp.x - cand.x, pp.z - cand.z) > 1.0) u.relocate(cand);
      }
    }
  },
});

<script type="module" data-module="post">
// =====================================================================================================================
//  POST — post-processing pipeline (EffectComposer: MSAA HDR render → bloom → grade → output) + all UI overlays
//  (start screen, pause/settings menu, help overlay, fade-in, hints, fps counter).  SPEC §9 post, §3.1/§3.3/§3.9
// =====================================================================================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const C = window.COZY;

// ---------------------------------------------------------------------------------------------------------------------
// Tunables
// ---------------------------------------------------------------------------------------------------------------------
const BLOOM = { strength: 0.3, radius: 0.5, threshold: 1.2 };      // softened after playtesting (lamps glared)
const BLOOM_MAX_PIXELS = 1920 * 1080;        // bloom input is capped to this (mip0 = half of it) for hi-dpi screens
const GRADE = { split: 0.55, vignette: 0.26, grain: 0.010 };

// Colour grade — runs on the linear HDR image (before tone mapping in the OutputPass).
const GradeShader = {
  name: 'CozyGrade',
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uFlash: { value: 0 },
    uSplit: { value: GRADE.split },
    uVignette: { value: GRADE.vignette },
    uGrain: { value: GRADE.grain },
    uAspect: { value: 16 / 9 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime, uFlash, uSplit, uVignette, uGrain, uAspect;
    varying vec2 vUv;
    const vec3 LW = vec3(0.2126, 0.7152, 0.0722);
    float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main() {
      vec3 col = max(texture2D(tDiffuse, vUv).rgb, vec3(0.0));
      float lum = dot(col, LW);

      // split toning: cool shadows, warm highlights (luminance preserving)
      float tl = lum / (lum + 0.22);
      vec3 tint = mix(vec3(0.955, 0.99, 1.07), vec3(1.05, 1.0, 0.925), smoothstep(0.18, 0.72, tl));
      vec3 g = col * mix(vec3(1.0), tint, uSplit);
      col = g * (lum / max(dot(g, LW), 1e-6));

      // lightning: brief global lift with a cool tint
      col = col * (1.0 + 0.55 * uFlash) + uFlash * vec3(0.006, 0.009, 0.016);
      col *= mix(vec3(1.0), vec3(0.9, 0.97, 1.14), clamp(uFlash, 0.0, 1.0) * 0.7);

      // gentle vignette (slightly elliptical, softer on wide screens)
      vec2 d = (vUv - 0.5) * vec2(mix(1.0, uAspect, 0.55), 1.0);
      float r = length(d) * 1.35;
      col *= 1.0 - uVignette * smoothstep(0.38, 1.05, r);

      // film grain (monochrome, ~24 fps, perceptually even: scaled like a display-space delta), doubles as dither
      float fr = floor(uTime * 24.0);
      vec2 p = gl_FragCoord.xy + vec2(fr * 37.0, fr * 71.0);
      float n = hash12(p) + hash12(p + 17.31) - 1.0;
      lum = dot(col, LW);
      col += n * (uGrain * 2.2 * pow(max(lum, 0.0) + 1e-4, 0.55) + 0.0006) * (col + 0.02) / (lum + 0.02);

      gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
    }`,
};

// Bloom bright-pass replacement: only the energy ABOVE the threshold blooms (soft knee), 4-tap box downsample
// (stable tiny highlights like fairy-light bulbs), firefly clamp. Uses UnrealBloomPass' own uniform object.
const BRIGHT_FRAG = /* glsl */`
  uniform sampler2D tDiffuse;
  uniform float luminosityThreshold;
  uniform vec2 uTexel;
  varying vec2 vUv;
  vec3 bright(vec2 uv) {
    vec3 c = texture2D(tDiffuse, uv).rgb;
    float l = max(max(c.r, c.g), c.b);
    if (!(l >= 0.0) || l > 60000.0) return vec3(0.0);   // NaN / Inf guard: one bad pixel blooms into a square blob
    c = max(c, vec3(0.0));
    float t = luminosityThreshold, knee = t * 0.5;
    float s = clamp(l - t + knee, 0.0, 2.0 * knee);
    s = s * s / (4.0 * knee + 1e-4);
    return min(c * (max(s, l - t) / max(l, 1e-4)), vec3(16.0));
  }
  void main() {
    vec2 o = uTexel;
    vec3 c = bright(vUv + vec2(-o.x, -o.y)) + bright(vUv + vec2(o.x, -o.y)) + bright(vUv + vec2(-o.x, o.y)) + bright(vUv + vec2(o.x, o.y));
    gl_FragColor = vec4(c * 0.25, 1.0);
  }`;
const QUAD_VERT = /* glsl */`
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

  font-size:15px;white-space:nowrap;color:#f3e3c9;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity 1.4s ease,visibility 0s linear 1.4s}

`;

// ---------------------------------------------------------------------------------------------------------------------
C.register({
  name: 'post',
  order: 90,

  init(C) {
    const S = this._s = {};
    // core checks C.ui at the end of boot to decide whether to install its own click-to-start fallback
    C.ui = C.ui || {};
    const AUTOSTART = C.params ? C.params.get('autostart') === '1' : /[?&]autostart=1/.test(location.search);
    S.autostart = AUTOSTART;

    try { buildUI(C, S); }
    catch (e) {
      recordError(C, 'init(ui)', e);
      // make sure the user can still get in
      const go = () => { C.renderer.domElement.removeEventListener('click', go); C.start(); };
      C.renderer.domElement.addEventListener('click', go);
    }
    try { buildPost(C, S); }
    catch (e) { recordError(C, 'init(post)', e); C.renderOverride = null; }
  },

  update(dt, t, C) {
    const S = this._s;
    if (!S) return;
    // fps counter (independent of core's F3 debug overlay)
    if (S.fpsEl) {
      const now = performance.now();
      S.fpsN++;
      if (now - S.fpsT >= 500) {
        const fps = S.fpsN * 1000 / (now - S.fpsT);
        S.fpsN = 0; S.fpsT = now;
        const dbg = C.hud && C.hud.el && C.hud.el.querySelector('.dbg');
        const coreShowing = dbg && dbg.style.display !== 'none';
        const want = !!C.settings.showFps && !coreShowing;
        if (want) S.fpsEl.textContent = fps.toFixed(0) + ' fps';
        setShown(S.fpsEl, want);
      }
    }
    // "click to look around" when playing without pointer lock (e.g. the browser refused an immediate re-lock)
    if (S.lookEl) {
      const st = C.state;
      const need = !S.autostart && !C.input.isTouch && st.started && !st.paused && !st.uiOpen && !C.input.pointerLocked;
      S.lookT = need ? (S.lookT || 0) + dt : 0;
      setShown(S.lookEl, S.lookT > 0.7);
    }
    if (S.tpauseEl) setShown(S.tpauseEl, C.input.isTouch && C.state.started && !C.state.paused && !C.state.uiOpen);
  },
});

function recordError(C, phase, e) {
  const entry = { module: 'post', phase, message: (e && e.message) || String(e), stack: e && e.stack ? String(e.stack).slice(0, 1500) : '' };
  if (C.debug && C.debug.errors) C.debug.errors.push(entry);
  console.error(`[COZY] post ${phase} error: ${entry.message}\n${entry.stack}`);
}

function setShown(el, on) {
  if (!el) return;
  if (on) { if (!el.classList.contains('show')) el.classList.add('show'); }
  else if (el.classList.contains('show')) el.classList.remove('show');
}

// =====================================================================================================================
//  Post-processing
// =====================================================================================================================
function buildPost(C, S) {
  const renderer = C.renderer;
  const size = renderer.getSize(new THREE.Vector2());
  const pr = renderer.getPixelRatio();
  const quality = () => C.settings.quality || 'high';

  // Main HDR target: half float, MSAA on medium/high (the canvas' antialias does not apply to render targets)
  const rtMain = new THREE.WebGLRenderTarget(Math.max(1, Math.round(size.x * pr)), Math.max(1, Math.round(size.y * pr)), {
    type: THREE.HalfFloatType, samples: quality() === 'low' ? 0 : 4,
  });
  rtMain.texture.name = 'post.main';
  const composer = new EffectComposer(renderer, rtMain);
  // second ping-pong target only receives the full-screen grade → no MSAA, no depth
  composer.renderTarget2.samples = 0;
  composer.renderTarget2.depthBuffer = false;
  composer.renderTarget2.texture.name = 'post.grade';

  const renderPass = new RenderPass(C.scene, C.camera);
  const bloom = new UnrealBloomPass(new THREE.Vector2(size.x, size.y), BLOOM.strength, BLOOM.radius, BLOOM.threshold);
  // cap bloom resolution on hi-dpi screens (it starts at half res and blurs heavily anyway)
  const bloomSetSize = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => {
    const s = Math.min(1, Math.sqrt(BLOOM_MAX_PIXELS / Math.max(1, w * h)));
    bloomSetSize(Math.max(4, Math.round(w * s)), Math.max(4, Math.round(h * s)));
    bloom.highPassUniforms.uTexel.value.set(1 / Math.max(1, w), 1 / Math.max(1, h));
  };
  bloom.highPassUniforms.uTexel = { value: new THREE.Vector2(1 / 1920, 1 / 1080) };
  bloom.materialHighPassFilter.dispose();
  bloom.materialHighPassFilter = new THREE.ShaderMaterial({
    name: 'post.bloomBright', uniforms: bloom.highPassUniforms, vertexShader: QUAD_VERT, fragmentShader: BRIGHT_FRAG,
    depthTest: false, depthWrite: false,
  });
  const grade = new ShaderPass(GradeShader);
  grade.material.name = 'post.grade';
  const output = new OutputPass();

  composer.addPass(renderPass);
  composer.addPass(bloom);
  composer.addPass(grade);
  composer.addPass(output);

  const gu = grade.uniforms;
  const _sz = new THREE.Vector2();
  let curW = -1, curH = -1, curPR = -1;
  function syncSize() {
    renderer.getSize(_sz);
    const p = renderer.getPixelRatio();
    if (_sz.x === curW && _sz.y === curH && p === curPR) return;
    curW = _sz.x; curH = _sz.y; curPR = p;
    composer._pixelRatio = p;                 // setPixelRatio() would resize twice
    composer.setSize(Math.max(1, curW), Math.max(1, curH));
    gu.uAspect.value = curW / Math.max(1, curH);
  }
  function applyQuality() {
    const q = quality();
    bloom.enabled = q !== 'low';
    const samples = q === 'low' ? 0 : 4;
    if (rtMain.samples !== samples) { rtMain.samples = samples; rtMain.dispose(); }
    syncSize();
  }

  let enabled = true;
  function render(dt) {
    syncSize();
    // the RenderPass draws into readBuffer — keep that the MSAA target (grade + output swap twice per frame)
    if (composer.readBuffer !== rtMain) composer.swapBuffers();
    gu.uTime.value = C.time % 1000;
    gu.uFlash.value = Math.min(1.5, Math.max(0, +C.env.lightningFlash || 0));
    composer.render(dt);
  }

  C.on('resize', syncSize);
  C.on('settings', applyQuality);
  applyQuality();

  // Compile the render-target program variants (no tone mapping, linear output) during core's boot compile instead of
  // on the first frame: we are the last module to init, and core calls renderer.compile() right after the inits.
  renderer.setRenderTarget(rtMain);
  C.on('ready', () => { if (renderer.getRenderTarget() === rtMain) renderer.setRenderTarget(null); });

  C.renderOverride = render;
  C.post = {
    composer, renderPass, bloom, grade, output, rtMain,
    get enabled() { return enabled; },
    setEnabled(on) { enabled = !!on; C.renderOverride = enabled ? render : null; },
    settings: { BLOOM, GRADE },
  };
  S.composer = composer;
}

// =====================================================================================================================
//  UI
// =====================================================================================================================
function buildUI(C, S) {
  const isTouch = !!(C.input && C.input.isTouch);
  const style = document.createElement('style');
  style.id = 'cozy-ui-css';
  style.textContent = CSS;
  document.head.appendChild(style);

  const root = document.createElement('div');
  root.id = 'cozy-ui';
  document.body.appendChild(root);
  const mk = (cls, html = '', tag = 'div') => { const el = document.createElement(tag); el.className = 'cz-layer ' + cls; el.innerHTML = html; root.appendChild(el); return el; };

  // ---------------------------------------------------------------- start screen
  const verb = isTouch ? 'Tap' : 'Click';
  const startControls = isTouch
    ? `<span>Left thumb to walk</span><span>Drag to look</span><span>Tap <b>Use</b> to interact</span>`
    : `<span>${keyCaps(['W', 'A', 'S', 'D'])} walk</span><span><kbd>Mouse</kbd> look</span><span><kbd>Shift</kbd> run</span>` +
      `<span><kbd>E</kbd> interact</span><span><kbd>F</kbd> flashlight</span><span><kbd>H</kbd> help</span><span><kbd>Esc</kbd> menu</span>`;
  const start = mk('cz-start', `
    <div class="cz-start-inner">
      ${HOUSE_SVG}
      <h1 class="cz-title">Rainy Day Cottage</h1>
      <div class="cz-rule"><span></span>✦<span></span></div>
      <p class="cz-sub">Put the kettle on. The fire is lit, the cat is asleep,<br>and the rain isn't going anywhere.</p>
      <div class="cz-cta">${verb} to step inside</div>
    </div>
    <div class="cz-start-foot"><button class="cz-link cz-open-settings" type="button">Settings</button></div>
    <div class="cz-controls">${startControls}</div>`);

  // ---------------------------------------------------------------- pause / settings
  const slider = (key, label, min, max, step) =>
    `<div class="cz-row"><label for="cz-${key}">${label}</label><input id="cz-${key}" type="range" min="${min}" max="${max}" step="${step}" data-key="${key}"><span class="cz-val" data-val="${key}"></span></div>`;
  const toggle = (key, label) =>
    `<div class="cz-row cz-tog"><span>${label}</span><label class="cz-switch"><input type="checkbox" data-key="${key}"><span></span></label></div>`;
  const pause = mk('cz-pause', `
    <div class="cz-panel" role="dialog" aria-label="Paused">
      <div class="cz-head">
        <div><h2 class="cz-ptitle">Paused</h2><p class="cz-psub">Take your time — the rain will wait.</p></div>
        <button class="cz-btn cz-resume" type="button">Resume</button>
      </div>
      <div class="cz-cols">
        <section>
          <h3>Sound</h3>
          ${slider('masterVolume', 'Master', 0, 1, 0.01)}
          ${slider('musicVolume', 'Music', 0, 1, 0.01)}
          ${slider('ambienceVolume', 'Ambience', 0, 1, 0.01)}
          ${slider('sfxVolume', 'Effects', 0, 1, 0.01)}
          <h3>Controls</h3>
          ${slider('mouseSensitivity', 'Mouse speed', 0.2, 3, 0.05)}
          ${toggle('invertY', 'Invert vertical look')}
          <h3>Display</h3>
          ${slider('fov', 'Field of view', 55, 100, 1)}
          <div class="cz-row cz-tog"><span>Quality</span><span class="cz-seg" data-seg="quality"><button type="button" data-v="low">Low</button><button type="button" data-v="medium">Medium</button><button type="button" data-v="high">High</button></span></div>
          ${toggle('headBob', 'Head bob')}
          ${toggle('showFps', 'Show FPS')}
        </section>
        <section>
          <h3>${isTouch ? 'Touch controls' : 'Keys'}</h3>
          ${keyRows(isTouch ? TOUCHMAP : KEYMAP)}
          <div class="cz-note">Things to try: light the fire, put the kettle on, play a record, curl up on the window seat, and find the cat.</div>
        </section>
      </div>
    </div>`);

  // ---------------------------------------------------------------- help overlay (never takes pointer events)
  const help = mk('cz-help', `<h2>Around the cottage</h2>${keyRows(isTouch ? TOUCHMAP : KEYMAP)}
    <div class="cz-foot">Press <kbd>H</kbd> to close</div>`);

  // ---------------------------------------------------------------- small overlays
  const fade = mk('cz-fade');
  const hint = mk('cz-hint', isTouch
    ? 'Left thumb to walk<span class="sep">·</span>drag to look<span class="sep">·</span>tap Use to interact'
    : `${keyCaps(['W', 'A', 'S', 'D'])} to walk<span class="sep">·</span><kbd>E</kbd> to interact<span class="sep">·</span><kbd>H</kbd> for help`);
  const look = mk('cz-look', 'Click to look around');
  const fps = mk('cz-fps');
  const tpause = mk('cz-tpause', '❚❚', 'button');
  S.fpsEl = fps; S.fpsN = 0; S.fpsT = performance.now();
  S.lookEl = look; S.tpauseEl = tpause;

  // ---------------------------------------------------------------- state
  let pauseMode = 'pause';      // 'pause' (in game) | 'settings' (opened from the start screen)
  let pauseOpenedAt = 0;
  let hintTimer = 0, hintShown = false;
  const isShown = el => el.classList.contains('show');

  function refreshSettings() {
    const s = C.settings;
    pause.querySelectorAll('input[type=range]').forEach(inp => {
      const k = inp.dataset.key;
      if (document.activeElement !== inp || +inp.value !== +s[k]) inp.value = s[k];
      updateSliderLook(inp);
    });
    pause.querySelectorAll('input[type=checkbox]').forEach(inp => { inp.checked = !!s[inp.dataset.key]; });
    pause.querySelectorAll('.cz-seg[data-seg=quality] button').forEach(b => b.classList.toggle('on', b.dataset.v === s.quality));
  }
  function fmt(k, v) {
    if (k === 'fov') return Math.round(v) + '°';
    if (k === 'mouseSensitivity') return (+v).toFixed(2) + '×';
    return Math.round(v * 100) + '%';
  }
  function updateSliderLook(inp) {
    const min = +inp.min, max = +inp.max, v = +inp.value;
    inp.style.setProperty('--p', ((v - min) / (max - min) * 100).toFixed(1) + '%');
    const lab = pause.querySelector(`[data-val="${inp.dataset.key}"]`);
    if (lab) lab.textContent = fmt(inp.dataset.key, v);
  }
  pause.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => { updateSliderLook(inp); C.setSetting(inp.dataset.key, +inp.value); });
    inp.addEventListener('keydown', e => { if (e.code !== 'Escape') e.stopPropagation(); });
  });
  pause.querySelectorAll('input[type=checkbox]').forEach(inp => {
    inp.addEventListener('change', () => C.setSetting(inp.dataset.key, !!inp.checked));
  });
  pause.querySelectorAll('.cz-seg[data-seg=quality] button').forEach(b => {
    b.addEventListener('click', () => { C.setSetting('quality', b.dataset.v); refreshSettings(); });
  });

  // ---------------------------------------------------------------- show / hide
  function showStart() {
    setShown(pause, false); setShown(help, false);
    setShown(start, true);
  }
  function showPause(mode = 'pause') {
    pauseMode = mode;
    pause.querySelector('.cz-ptitle').textContent = mode === 'settings' ? 'Settings' : 'Paused';
    pause.querySelector('.cz-psub').textContent = mode === 'settings' ? 'Make yourself comfortable.' : 'Take your time — the rain will wait.';
    pause.querySelector('.cz-resume').textContent = mode === 'settings' ? 'Back' : 'Resume';
    refreshSettings();
    setShown(help, false); setShown(start, false);
    setShown(pause, true);
    pauseOpenedAt = performance.now();
    C.state.uiOpen = true;
  }
  function hidePause() {
    if (isShown(pause)) setShown(pause, false);
    C.state.uiOpen = false;
  }
  function showHelp() { setShown(help, true); }
  function hideHelp() { setShown(help, false); }
  function toggleHelp() { setShown(help, !isShown(help)); }
  function hideAll() {
    setShown(start, false); setShown(help, false);
    hidePause();
  }

  // ---------------------------------------------------------------- actions (all inside the user gesture)
  const blurActive = () => { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); };
  function doStart() {
    if (!isShown(start)) return;
    blurActive();
    setShown(start, false);
    if (C.state.started) C.resume(); else C.start();
  }
  function doResume() {
    blurActive();
    if (pauseMode === 'settings') { hidePause(); showStart(); return; }
    hidePause();
    C.resume();
  }
  start.addEventListener('click', doStart);
  start.querySelector('.cz-open-settings').addEventListener('click', e => { e.stopPropagation(); showPause('settings'); });
  pause.querySelector('.cz-resume').addEventListener('click', doResume);
  tpause.addEventListener('click', () => { if (C.state.started && !C.state.paused) C.pause(); });
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (isShown(pause) && e.code === 'Escape') {
      if (performance.now() - pauseOpenedAt < 350) return;   // same Esc that just released the pointer lock
      e.preventDefault(); doResume();
    } else if (isShown(start) && !isShown(pause) && (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter')) {
      e.preventDefault(); doStart();
    }
  });

  // ---------------------------------------------------------------- events
  C.input.onKey('KeyH', () => toggleHelp());
  C.on('start', () => {
    hideAll();
    if (S.autostart) return;
    // gentle fade in from black
    fade.classList.add('show');
    void fade.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => setShown(fade, false)));
    if (!hintShown) {
      hintShown = true;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        setShown(hint, true);
        hintTimer = setTimeout(() => setShown(hint, false), 6500);
      }, 1400);
    }
  });
  C.on('pause', () => { hideHelp(); setShown(hint, false); showPause('pause'); });
  C.on('resume', () => hideAll());
  C.on('settings', () => { if (isShown(pause)) refreshSettings(); });

  Object.assign(C.ui, {
    el: root,
    showStart, showPause: () => showPause('pause'), showSettings: () => showPause('settings'),
    showHelp, hideHelp, toggleHelp, hideAll,
    isOpen: () => isShown(start) || isShown(pause),
  });

  if (!S.autostart) showStart();
}

</script>
