<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rainy Day Cottage — a cozy house simulator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #f3ead8;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #boot-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #2a2320 0%, #0d0f14 70%); z-index: 1000; transition: opacity 0.8s ease; }
  #boot-loading .title { font-size: 34px; letter-spacing: 2px; color: #f7e3c4; text-shadow: 0 0 24px rgba(255,170,90,0.35); }
  #boot-loading .msg { margin-top: 14px; font-size: 15px; color: #cdbfa8; font-style: italic; }
  #boot-loading.hidden { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="boot-loading"><div class="title">Rainy Day Cottage</div><div class="msg">putting the kettle on…</div></div>
<script>
  // If the 3D engine could not be fetched (offline / CDN blocked) tell the user instead of hanging forever.
  setTimeout(function () {
    if (!window.COZY || !window.COZY.ready) {
      var el = document.getElementById('boot-loading');
      if (el && !el.classList.contains('hidden')) {
        var m = el.querySelector('.msg');
        if (m && !window.COZY) m.textContent = 'Still loading… this page needs an internet connection the first time (it loads three.js from cdn.jsdelivr.net).';
      }
    }
  }, 12000);
</script>
<script type="module" data-module="core">
// =====================================================================================================================
//  COZY CORE — engine, loop, input, physics, interaction, HUD, utilities, debug API.  (see SPEC.md §3)
// =====================================================================================================================
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';
const AUTOSTART = params.get('autostart') === '1';

const C = window.COZY = {
  THREE, version: '1.0.0', params, DEBUG,
  modules: [], ready: false, time: 0, frame: 0,
  state: { started: false, paused: false, uiOpen: false, muted: params.get('mute') === '1' },
  renderOverride: null,
  mats: {}, lights: [],
};

// ---------------------------------------------------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------------------------------------------------
const listeners = new Map();
C.on = (name, fn) => { if (!listeners.has(name)) listeners.set(name, new Set()); listeners.get(name).add(fn); return fn; };
C.off = (name, fn) => { const s = listeners.get(name); if (s) s.delete(fn); };
C.emit = (name, payload) => {
  const s = listeners.get(name);
  if (!s) return;
  for (const fn of [...s]) { try { fn(payload); } catch (e) { reportError({ name: 'event:' + name }, 'event', e); } }
};
C.log = (tag, ...args) => { if (DEBUG) console.debug(`[${tag}]`, ...args); };

// ---------------------------------------------------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------------------------------------------------
const DEFAULT_SETTINGS = { masterVolume: 0.8, musicVolume: 0.7, ambienceVolume: 0.9, sfxVolume: 0.8, mouseSensitivity: 1.0,
  invertY: false, fov: 70, quality: 'high', headBob: false, showFps: false };
let savedSettings = {};
try { savedSettings = JSON.parse(localStorage.getItem('cozy-settings-v1') || '{}') || {}; } catch (e) { savedSettings = {}; }
C.settings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);
if (['low', 'medium', 'high'].includes(params.get('quality'))) C.settings.quality = params.get('quality');
C.setSetting = (key, value) => {
  C.settings[key] = value;
  if (!DEBUG) { try { localStorage.setItem('cozy-settings-v1', JSON.stringify(C.settings)); } catch (e) { /* ignore */ } }
  applySettings();
  C.emit('settings', C.settings);
};

// ---------------------------------------------------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
renderer.domElement.id = 'cozy-canvas';
renderer.domElement.tabIndex = 0;
document.body.appendChild(renderer.domElement);
C.renderer = renderer;

function pixelRatioFor(q) {
  const d = window.devicePixelRatio || 1;
  return q === 'low' ? Math.min(d, 1) * 0.8 : q === 'medium' ? Math.min(d, 1.25) : Math.min(d, 2);
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(C.settings.fov, innerWidth / innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);
C.scene = scene;
C.camera = camera;
C.clock = new THREE.Clock();

function resize() {
  renderer.setPixelRatio(pixelRatioFor(C.settings.quality));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  camera.updateProjectionMatrix();
  C.emit('resize', { w: innerWidth, h: innerHeight });
}
addEventListener('resize', resize);
function applySettings() {
  if (Math.abs(camera.fov - C.settings.fov) > 0.01) { camera.fov = C.settings.fov; camera.updateProjectionMatrix(); }
  const pr = pixelRatioFor(C.settings.quality);
  if (Math.abs(renderer.getPixelRatio() - pr) > 1e-3) resize();
  const wantShadows = C.settings.quality === 'high';
  if (renderer.shadowMap.enabled !== wantShadows) {
    renderer.shadowMap.enabled = wantShadows;
    scene.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); });
  }
}
renderer.setPixelRatio(pixelRatioFor(C.settings.quality));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = C.settings.quality === 'high';

// ---------------------------------------------------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------------------------------------------------
const seenErrors = new Set();
function reportError(mod, phase, e) {
  const message = (e && e.message) || String(e);
  const key = `${mod && mod.name}|${phase}|${message}`;
  const entry = { module: mod && mod.name, phase, message, stack: e && e.stack ? String(e.stack).slice(0, 1500) : '' };
  if (!seenErrors.has(key)) {
    seenErrors.add(key);
    C.debug.errors.push(entry);
    console.error(`[COZY] ${entry.module} ${phase} error: ${message}\n${entry.stack}`);
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------------------------------------------------
const input = C.input = {
  keys: new Set(), virtualKeys: new Set(),
  virtual: { moveX: 0, moveY: 0, lookX: 0, lookY: 0 },
  mouse: { dx: 0, dy: 0 },
  pointerLocked: false,
  isTouch: (window.matchMedia && matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0) || false,
};
input.isDown = code => input.keys.has(code) || input.virtualKeys.has(code);
const keyHandlers = new Map();
input.onKey = (code, fn) => { if (!keyHandlers.has(code)) keyHandlers.set(code, []); keyHandlers.get(code).push(fn); };
input.consumeMouse = () => { const r = { dx: input.mouse.dx, dy: input.mouse.dy }; input.mouse.dx = 0; input.mouse.dy = 0; return r; };

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (e.code === 'F3') { e.preventDefault(); debugOverlayOn = !debugOverlayOn; hudDebug.style.display = debugOverlayOn ? 'block' : 'none'; return; }
  input.keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape' && C.state.started && !input.pointerLocked && !C.state.uiOpen) {
    if (C.state.paused) C.resume(); else C.pause();
    return;
  }
  if (C.state.uiOpen || !C.state.started) return;
  if (C.state.paused) return;
  if (e.code === 'KeyE') {
    if (C.interact.focused) C.interact.useFocused();
    else if (C.player.mode === 'sit') C.player.stand();
  }
  const hs = keyHandlers.get(e.code);
  if (hs) for (const h of hs) { try { h(e); } catch (err) { reportError({ name: 'key:' + e.code }, 'input', err); } }
});
addEventListener('keyup', e => { input.keys.delete(e.code); });
addEventListener('blur', () => input.keys.clear());
addEventListener('mousemove', e => {
  if (input.pointerLocked) { input.mouse.dx += e.movementX || 0; input.mouse.dy += e.movementY || 0; }
});
function requestLock() {
  if (input.isTouch || AUTOSTART) return;
  try {
    const p = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(() => { /* needs another click */ });
  } catch (e) { /* ignore */ }
}
C.requestPointerLock = requestLock;
document.addEventListener('pointerlockchange', () => {
  input.pointerLocked = document.pointerLockElement === renderer.domElement;
  if (!input.pointerLocked && C.state.started && !C.state.paused && !C.state.uiOpen && !AUTOSTART) C.pause();
});
renderer.domElement.addEventListener('mousedown', e => {
  if (!C.state.started || C.state.uiOpen) return;
  if (C.state.paused) return;
  if (!input.pointerLocked && !input.isTouch && !AUTOSTART) { requestLock(); return; }
  if (e.button === 0 && C.interact.focused) C.interact.useFocused();
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------------------------------------------------------------
// Start / pause
// ---------------------------------------------------------------------------------------------------------------------
C.start = (opts = {}) => {
  const first = !C.state.started;
  C.state.started = true;
  C.state.paused = false;
  if (!opts.auto) requestLock();
  hud.classList.add('on');
  if (first) C.emit('start');
  else C.emit('resume');
};
C.pause = () => {
  if (!C.state.started || C.state.paused) return;
  C.state.paused = true;
  input.keys.clear();
  C.emit('pause');
};
C.resume = () => {
  if (!C.state.started) return C.start();
  C.state.paused = false;
  requestLock();
  C.emit('resume');
};

// ---------------------------------------------------------------------------------------------------------------------
// Player state (driven by the player module)
// ---------------------------------------------------------------------------------------------------------------------
C.world = {};
C.world.spawn = { x: 0.4, y: 0, z: 2.0, yaw: Math.PI / 2 };
C.player = {
  position: new THREE.Vector3(C.world.spawn.x, C.world.spawn.y, C.world.spawn.z),
  velocity: new THREE.Vector3(), yaw: C.world.spawn.yaw, pitch: -0.05,
  height: 1.75, crouchHeight: 1.2, eyeHeight: 1.62, radius: 0.28, stepUp: 0.35,
  crouch: 0, grounded: true, surface: 'wood', mode: 'walk', seat: null,
  bob: new THREE.Vector3(), cameraOwner: null,
  sitAt(seat) {
    this.seat = seat; this.mode = 'sit'; this.velocity.set(0, 0, 0);
    C.emit('sit', { id: seat && seat.id });
  },
  stand() {
    const s = this.seat;
    if (s && s.exit) this.position.set(s.exit[0], s.exit[1], s.exit[2]);
    this.seat = null; this.mode = 'walk'; this.velocity.set(0, 0, 0);
    if (s && typeof s.yawAfter === 'number') this.yaw = s.yawAfter;
    C.emit('stand', { id: s && s.id });
  },
};

// ---------------------------------------------------------------------------------------------------------------------
// Physics
// ---------------------------------------------------------------------------------------------------------------------
const V3 = (v) => (v && v.isVector3) ? v.clone() : Array.isArray(v) ? new THREE.Vector3(v[0], v[1], v[2]) : new THREE.Vector3(v.x, v.y, v.z);
let colliderId = 0;
const boxes = [], cyls = [], floors = [], ramps = [], tags = [];
function removeFrom(arr, item) { const i = arr.indexOf(item); if (i >= 0) arr.splice(i, 1); physics._dirty = true; }
const physics = C.physics = {
  colliders: [], _dirty: true,
  addBox(min, max, opts = {}) {
    const a = V3(min), b = V3(max);
    const h = {
      id: ++colliderId, type: 'box', min: a.clone().min(b), max: a.clone().max(b), enabled: true,
      tag: opts.tag || 'solid', name: opts.name || '',
      blocksInteract: opts.blocksInteract !== undefined ? !!opts.blocksInteract : (opts.tag === 'wall' || opts.tag === 'door'),
      set(mn, mx) { const p = V3(mn), q = V3(mx); this.min.copy(p).min(q); this.max.copy(p).max(q); physics._dirty = true; return this; },
      remove() { removeFrom(boxes, h); removeFrom(physics.colliders, h); },
    };
    boxes.push(h); physics.colliders.push(h); physics._dirty = true;
    return h;
  },
  addBoxFromObject(obj, opts = {}) {
    obj.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(obj);
    if (bb.isEmpty()) return null;
    const pad = opts.pad || 0;
    bb.min.x -= pad; bb.min.z -= pad; bb.max.x += pad; bb.max.z += pad;
    if (opts.minY !== undefined) bb.min.y = opts.minY;
    if (opts.maxY !== undefined) bb.max.y = opts.maxY;
    return physics.addBox(bb.min, bb.max, opts);
  },
  addCylinder(x, z, radius, yMin, yMax, opts = {}) {
    const h = {
      id: ++colliderId, type: 'cyl', x, z, r: radius, yMin, yMax, enabled: true, tag: opts.tag || 'solid', name: opts.name || '',
      blocksInteract: !!opts.blocksInteract,
      set(nx, nz, nr) { this.x = nx; this.z = nz; if (nr !== undefined) this.r = nr; physics._dirty = true; return this; },
      remove() { removeFrom(cyls, h); removeFrom(physics.colliders, h); },
    };
    cyls.push(h); physics.colliders.push(h); physics._dirty = true;
    return h;
  },
  addFloor(minX, minZ, maxX, maxZ, y, opts = {}) {
    const f = { minX: Math.min(minX, maxX), maxX: Math.max(minX, maxX), minZ: Math.min(minZ, maxZ), maxZ: Math.max(minZ, maxZ), y,
      surface: opts.surface || 'wood', name: opts.name || '' };
    f.remove = () => removeFrom(floors, f);
    floors.push(f); physics._dirty = true;
    return f;
  },
  addRamp(minX, minZ, maxX, maxZ, axis, y0, y1, opts = {}) {
    const r = { minX: Math.min(minX, maxX), maxX: Math.max(minX, maxX), minZ: Math.min(minZ, maxZ), maxZ: Math.max(minZ, maxZ),
      axis: axis === 'x' ? 'x' : 'z', y0, y1, surface: opts.surface || 'wood', name: opts.name || '' };
    r.remove = () => removeFrom(ramps, r);
    ramps.push(r); physics._dirty = true;
    return r;
  },
  addSurfaceTag(minX, minZ, maxX, maxZ, yMin, yMax, surface) {
    const t = { minX: Math.min(minX, maxX), maxX: Math.max(minX, maxX), minZ: Math.min(minZ, maxZ), maxZ: Math.max(minZ, maxZ), yMin, yMax, surface };
    t.remove = () => removeFrom(tags, t);
    tags.push(t);
    return t;
  },
  groundAt(x, z, feetY, stepUp = 0.35) {
    const limit = feetY + stepUp + 1e-6;
    let bestY = -Infinity, bestS = null;
    for (let i = 0; i < floors.length; i++) {
      const f = floors[i];
      if (x < f.minX || x > f.maxX || z < f.minZ || z > f.maxZ) continue;
      if (f.y <= limit && f.y > bestY) { bestY = f.y; bestS = f.surface; }
    }
    for (let i = 0; i < ramps.length; i++) {
      const r = ramps[i];
      if (x < r.minX || x > r.maxX || z < r.minZ || z > r.maxZ) continue;
      const t = r.axis === 'x' ? (x - r.minX) / (r.maxX - r.minX || 1) : (z - r.minZ) / (r.maxZ - r.minZ || 1);
      const y = r.y0 + (r.y1 - r.y0) * t;
      if (y <= limit && y > bestY) { bestY = y; bestS = r.surface; }
    }
    if (bestS === null) return null;
    return { y: bestY, surface: physics.surfaceAt(x, bestY, z, bestS) };
  },
  surfaceAt(x, y, z, fallback) {
    for (let i = tags.length - 1; i >= 0; i--) {
      const t = tags[i];
      if (x >= t.minX && x <= t.maxX && z >= t.minZ && z <= t.maxZ && y >= t.yMin && y <= t.yMax) return t.surface;
    }
    if (fallback) return fallback;
    const g = physics._groundRaw(x, z, y + 0.05);
    return g ? g.surface : 'none';
  },
  _groundRaw(x, z, limit) {
    let bestY = -Infinity, bestS = null;
    for (const f of floors) if (x >= f.minX && x <= f.maxX && z >= f.minZ && z <= f.maxZ && f.y <= limit && f.y > bestY) { bestY = f.y; bestS = f.surface; }
    for (const r of ramps) {
      if (x < r.minX || x > r.maxX || z < r.minZ || z > r.maxZ) continue;
      const t = r.axis === 'x' ? (x - r.minX) / (r.maxX - r.minX || 1) : (z - r.minZ) / (r.maxZ - r.minZ || 1);
      const y = r.y0 + (r.y1 - r.y0) * t;
      if (y <= limit && y > bestY) { bestY = y; bestS = r.surface; }
    }
    return bestS === null ? null : { y: bestY, surface: bestS };
  },
  // push a vertical circle (feet position pos, radius, height) out of all colliders; returns true if it touched anything
  resolve(pos, radius, height, stepUp = 0.35) {
    const yLo = pos.y + stepUp + 0.01, yHi = pos.y + height;
    let hit = false;
    for (let iter = 0; iter < 4; iter++) {
      let moved = false;
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (!b.enabled || b.max.y <= yLo || b.min.y >= yHi) continue;
        if (pos.x < b.min.x - radius || pos.x > b.max.x + radius || pos.z < b.min.z - radius || pos.z > b.max.z + radius) continue;
        const cx = pos.x < b.min.x ? b.min.x : pos.x > b.max.x ? b.max.x : pos.x;
        const cz = pos.z < b.min.z ? b.min.z : pos.z > b.max.z ? b.max.z : pos.z;
        const dx = pos.x - cx, dz = pos.z - cz;
        const d2 = dx * dx + dz * dz;
        if (d2 >= radius * radius) continue;
        if (d2 > 1e-12) {
          const d = Math.sqrt(d2), push = radius - d + 1e-5;
          pos.x += dx / d * push; pos.z += dz / d * push;
        } else {
          const l = pos.x - b.min.x, r = b.max.x - pos.x, bk = pos.z - b.min.z, f = b.max.z - pos.z;
          const m = Math.min(l, r, bk, f);
          if (m === l) pos.x = b.min.x - radius; else if (m === r) pos.x = b.max.x + radius;
          else if (m === bk) pos.z = b.min.z - radius; else pos.z = b.max.z + radius;
        }
        moved = true; hit = true;
      }
      for (let i = 0; i < cyls.length; i++) {
        const c = cyls[i];
        if (!c.enabled || c.yMax <= yLo || c.yMin >= yHi) continue;
        const dx = pos.x - c.x, dz = pos.z - c.z, rr = radius + c.r;
        const d2 = dx * dx + dz * dz;
        if (d2 >= rr * rr) continue;
        const d = Math.sqrt(d2) || 1e-6;
        const push = rr - d + 1e-5;
        pos.x += (d2 > 1e-12 ? dx / d : 1) * push; pos.z += (d2 > 1e-12 ? dz / d : 0) * push;
        moved = true; hit = true;
      }
      if (!moved) break;
    }
    return hit;
  },
  move(pos, dx, dz, radius = 0.28, height = 1.75, stepUp = 0.35) {
    const dist = Math.hypot(dx, dz);
    const steps = Math.max(1, Math.ceil(dist / 0.1));
    const sx = dx / steps, sz = dz / steps;
    let hit = false;
    for (let s = 0; s < steps; s++) {
      pos.x += sx; pos.z += sz;
      if (physics.resolve(pos, radius, height, stepUp)) hit = true;
    }
    if (dist === 0 && physics.resolve(pos, radius, height, stepUp)) hit = true;
    return { hit };
  },
  raycast(origin, dir, maxDist = 100, filter) {
    let best = null, bestD = maxDist;
    const ox = origin.x, oy = origin.y, oz = origin.z, dx = dir.x, dy = dir.y, dz = dir.z;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (!b.enabled || (filter && !filter(b))) continue;
      let tmin = 0, tmax = bestD;
      let ok = true;
      for (let a = 0; a < 3 && ok; a++) {
        const o = a === 0 ? ox : a === 1 ? oy : oz, d = a === 0 ? dx : a === 1 ? dy : dz;
        const mn = a === 0 ? b.min.x : a === 1 ? b.min.y : b.min.z, mx = a === 0 ? b.max.x : a === 1 ? b.max.y : b.max.z;
        if (Math.abs(d) < 1e-9) { if (o < mn || o > mx) ok = false; continue; }
        let t1 = (mn - o) / d, t2 = (mx - o) / d;
        if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
        if (t1 > tmin) tmin = t1;
        if (t2 < tmax) tmax = t2;
        if (tmin > tmax) ok = false;
      }
      if (ok && tmin < bestD) { bestD = tmin; best = b; }
    }
    for (let i = 0; i < cyls.length; i++) {
      const c = cyls[i];
      if (!c.enabled || (filter && !filter(c))) continue;
      const px = ox - c.x, pz = oz - c.z;
      const A = dx * dx + dz * dz, B = 2 * (px * dx + pz * dz), Cc = px * px + pz * pz - c.r * c.r;
      if (A < 1e-9) continue;
      const disc = B * B - 4 * A * Cc;
      if (disc < 0) continue;
      const t = Cc <= 0 ? 0 : (-B - Math.sqrt(disc)) / (2 * A);
      if (t < 0 || t >= bestD) continue;
      const y = oy + dy * t;
      if (y < c.yMin || y > c.yMax) continue;
      bestD = t; best = c;
    }
    return best ? { dist: bestD, collider: best } : null;
  },
  debugDraw(on) {
    if (physics._debugGroup) { scene.remove(physics._debugGroup); physics._debugGroup = null; }
    if (!on) return;
    const g = new THREE.Group(); g.name = 'core.physicsDebug';
    const pts = { box: [], floor: [], ramp: [], cyl: [] };
    const edge = (arr, a, b) => arr.push(a[0], a[1], a[2], b[0], b[1], b[2]);
    for (const b of boxes) {
      if (!b.enabled) continue;
      const x0 = b.min.x, y0 = b.min.y, z0 = b.min.z, x1 = b.max.x, y1 = b.max.y, z1 = b.max.z;

        U.cyl(g, 0.032, 0.032, 0.008, M.iron, pp[0], pp[1], pp[2], along === 'z' ? { rz: Math.PI / 2, radial: 14 } : { rx: Math.PI / 2, radial: 14 });
      }
      // hinges
      for (const y of [0.3, 1.72]) L(-0.004, y - 0.05, t0 - 0.002, 0.03, y + 0.05, t1 + 0.002, M.iron);
    };
    // D2 kitchen ↔ study: opening z −3.1→−2.2 in P1, hinge z −3.1 (+0.03 jamb), leaf on the study side, swings +X 95°
    doors.kitchenStudy = makeDoor({
      id: 'door_kitchen_study', label: 'the study door', pivot: [2.055, 0, -3.07], openAngle: THREE.MathUtils.degToRad(95),
      closedBox: [[1.925, 0, -3.1], [2.075, 2.05, -2.2]], openBox: [[2.03, 0, -3.18], [2.92, 2.05, -3.02]], center: [2.0, 1.0, -2.65],
      build(g) { ledgedDoor(g, 'z', 0.84, 0.035, 1); },
    });
    // D3 hall ↔ study: opening x 2.6→3.5 in P2, hinge x 2.6 (+0.03), leaf on the study side, swings −Z 95°
    doors.hallStudy = makeDoor({
      id: 'door_hall_study', label: 'the study door', pivot: [2.63, 0, -0.755], openAngle: THREE.MathUtils.degToRad(95),
      closedBox: [[2.6, 0, -0.775], [3.5, 2.05, -0.625]], openBox: [[2.53, 0, -1.62], [2.7, 2.05, -0.73]], center: [3.05, 1.0, -0.7],
      build(g) { ledgedDoor(g, 'x', 0.84, 0.035, -1); },
    });

    // -----------------------------------------------------------------------------------------------------------------
    // Bake + publish API
    // -----------------------------------------------------------------------------------------------------------------
    U.bakeStatic(S);
    const doorList = [doors.front, doors.kitchenStudy, doors.hallStudy];
    this._doors = doorList;

    C.house = {
      root, doors, windows, glassPanes, colliders, beams,
      levels: { ground: 0, ceiling: 2.8, upper: 3.0, eave: 4.0, ridgeUnder: 7.5, wallThickness: WT, interior: { x: 6.75, z: 4.75 } },
      wainscotY: WAIN, skirting: SK,
      stairs: { x0: ST.x0, x1: ST.x1, zBottom: ST.zBot, zTop: ST.zTop, risers: ST.n, rise: ST.rise, run: ST.run },
      roofUnderY: z => yu(z),
      roofY(x, z) {
        const ax = Math.abs(x), az = Math.abs(z);
        if (ax <= 7.4 && az <= 5.6) return 7.77 - 0.7 * az;
        if (x >= 1.0 && x <= 7.0 && z >= 5.0 && z <= 7.4) return 3.27 - 0.25 * (z - 5.0);
        if (x >= -7.9 && x <= -7.0 && z >= 1.8 && z <= 3.2) return 8.4;
        return null;
      },
      window: id => windows.find(w => w.id === id) || null,
    };
  },
  update(dt) {
    const ds = this._doors;
    if (!ds) return;
    for (let i = 0; i < ds.length; i++) {
      const d = ds[i];
      if (d.angle === d.target) continue;
      const k = 1 - Math.exp(-7 * dt);
      d.angle += (d.target - d.angle) * k;
      if (Math.abs(d.target - d.angle) < 0.002) d.angle = d.target;
      d.object.rotation.y = d.angle;
    }
  },
});

</script>
<script type="module" data-module="player">
// =====================================================================================================================
//  PLAYER — first-person controller on top of core physics (SPEC §3.4, §3.5, §9 player).
//
//  Walk 2.0 m/s · run 3.8 (Shift) · crouch 1.1 (hold C / Ctrl) · jump (Space) · F flashlight.
//  Grounded players snap up ramps/steps (≤ stepUp) and down (≤ 0.4 m); airborne players fall with gravity 12 m/s².
//  Ceilings: the underside of any floor slab above the head (floor.y − 0.2) and the loft roof (7.5 − 0.7·|z|).
//
//  Seats: C.player.sitAt(seat) (core) → this module eases the camera to seat.position (EYE) and limits the look to
//    seat.yaw ± seat.yawRange (1.4), pitch ∈ [seat.pitchMin (−1.0), seat.pitchMax (1.2)]. Extras understood here:
//    seat.pitch (initial pitch), seat.rock (amplitude, e.g. 0.04 → gentle rocking-chair sway), seat.lie (bed).
//    Any movement key (pressed after sitting), Space or E (core) stands up → core teleports FEET to seat.exit.
//  Touch: C.input.virtual.moveX (+right) / moveY (+forward) from the left joystick; right-side drag feeds
//    C.input.mouse; on-screen Use / Jump / Crouch / pause buttons.
//  Debug: C.debug.simulate({ from, yaw, pitch, keys, seconds, dt }) steps the physics synchronously (walk tests).
//  Noclip ('noclip' mode, e.g. ?cam= / ?freecam=1): position is the EYE; WASD fly, Space up, C down, Shift fast.
//  Events emitted: 'footstep' {surface, run, crouch, x,y,z} every ~0.62 m, 'jump' / 'land' {surface, speed},
//    'flashlight' {on}.  Consumed: 'sit', 'stand', 'teleport', 'start', 'pause', 'resume', 'settings'.
// =====================================================================================================================
import * as THREE from 'three';
const C = window.COZY;

const WALK = 2.0, RUN = 3.8, CROUCH = 1.1;
const GRAVITY = 12, JUMP_V = 3.6;
const STEP_DOWN = 0.4, STEP_LEN = 0.62;
const MOUSE_SENS = 0.0022;
const MOVE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

C.register({
  name: 'player',
  order: 10,

  init(C) {
    const p = C.player, U = C.util, input = C.input, physics = C.physics;
    p.cameraOwner = 'player';
    const cam = C.camera;

    // ------------------------------------------------------------------ state
    const st = this.st = {
      airborne: false, prevJump: false, prevCrouchBtn: false,
      stepPhase: 0,          // steps taken (fractional) — drives bob + footsteps
      bobAmp: 0,             // 0..1 blend of head bob
      dip: 0, dipV: 0,       // landing spring
      fallSpeed: 0,
      sitTimer: 0, sitBlock: false,
      trans: 0,              // camera ease timer (sit / stand transitions)
      camPos: new THREE.Vector3(), camYaw: p.yaw, camPitch: p.pitch,
      touchCrouch: false,
      flashlightOn: false,
    };
    const tmpV = new THREE.Vector3(), eye = new THREE.Vector3();
    const ceilingFloors = physics._lists ? physics._lists.floors : [];

    // ------------------------------------------------------------------ helpers
    const wrap = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
    const anyMoveDown = () => MOVE_KEYS.some(k => input.isDown(k)) ||
      Math.abs(input.virtual.moveX) > 0.25 || Math.abs(input.virtual.moveY) > 0.25;
    const inputOn = () => C.state.started && !C.state.paused && !C.state.uiOpen;
    const standingHeight = () => U.lerp(p.height, p.crouchHeight, p.crouch);

    // lowest ceiling above the player's head at (x, z) given feet y (floor slabs are 0.2 thick; loft roof slope)
    function ceilingAt(x, z, feetY) {
      let c = Infinity;
      for (let i = 0; i < ceilingFloors.length; i++) {
        const f = ceilingFloors[i];
        if (x < f.minX || x > f.maxX || z < f.minZ || z > f.maxZ) continue;
        if (f.y - 0.2 > feetY + 0.5 && f.y - 0.2 < c) c = f.y - 0.2;
      }
      if (feetY > 2.6 && Math.abs(x) <= 6.75 && Math.abs(z) <= 4.75) {
        const roof = 7.5 - 0.7 * Math.abs(z) - 0.08;
        if (roof < c) c = roof;
      }
      return c;
    }

    function startTransition() {
      st.trans = 0.7;
    }

    // ------------------------------------------------------------------ physics step (shared by the loop and simulate)
    const wish = new THREE.Vector3();
    function step(dt, sim) {
      const pos = p.position, vel = p.velocity;
      const allowInput = sim || inputOn();

      // ----- sitting / lying
      if (p.mode === 'sit') {
        st.sitTimer += dt;
        const moving = allowInput && anyMoveDown();
        if (!moving) st.sitBlock = false;
        const jump = allowInput && input.isDown('Space');
        if (((moving && !st.sitBlock) || (jump && !st.prevJump)) && st.sitTimer > 0.25) p.stand();
        st.prevJump = jump;
        return;
      }

      // ----- noclip fly (position = EYE)
      if (p.mode === 'noclip') {
        if (!allowInput) return;
        const sp = (input.isDown('ShiftLeft') || input.isDown('ShiftRight')) ? 9 : 3;
        let f = 0, r = 0, u = 0;
        if (input.isDown('KeyW') || input.isDown('ArrowUp')) f += 1;
        if (input.isDown('KeyS') || input.isDown('ArrowDown')) f -= 1;
        if (input.isDown('KeyD') || input.isDown('ArrowRight')) r += 1;
        if (input.isDown('KeyA') || input.isDown('ArrowLeft')) r -= 1;
        if (input.isDown('Space')) u += 1;
        if (input.isDown('KeyC') || input.isDown('ControlLeft')) u -= 1;
        f += input.virtual.moveY; r += input.virtual.moveX;
        const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw), cp = Math.cos(p.pitch), spch = Math.sin(p.pitch);
        pos.x += (-sy * cp * f + cy * r) * sp * dt;
        pos.y += (spch * f + u) * sp * dt;
        pos.z += (-cy * cp * f - sy * r) * sp * dt;
        return;
      }

      // ----- walk mode
      let f = 0, r = 0;
      let run = false, crouchWanted = st.touchCrouch;
      if (allowInput) {
        if (input.isDown('KeyW') || input.isDown('ArrowUp')) f += 1;
        if (input.isDown('KeyS') || input.isDown('ArrowDown')) f -= 1;
        if (input.isDown('KeyD') || input.isDown('ArrowRight')) r += 1;
        if (input.isDown('KeyA') || input.isDown('ArrowLeft')) r -= 1;
        f += input.virtual.moveY; r += input.virtual.moveX;
        run = input.isDown('ShiftLeft') || input.isDown('ShiftRight') ||
          Math.hypot(input.virtual.moveX, input.virtual.moveY) > 0.95;
        crouchWanted = crouchWanted || input.isDown('KeyC') || input.isDown('ControlLeft') || input.isDown('ControlRight');
      }
      const len = Math.hypot(f, r);
      if (len > 1) { f /= len; r /= len; }

      // crouch (can't stand up under something)
      const crouchTarget = crouchWanted ? 1 : 0;
      if (crouchTarget < p.crouch) {
        tmpV.copy(pos);
        physics.resolve(tmpV, p.radius, p.height, p.stepUp);
        const blocked = tmpV.distanceToSquared(pos) > 1e-4 || pos.y + p.height > ceilingAt(pos.x, pos.z, pos.y);
        if (!blocked) p.crouch = Math.max(0, p.crouch - dt * 6);
      } else if (crouchTarget > p.crouch) p.crouch = Math.min(1, p.crouch + dt * 6);   // plain `else` bounced 0 ↔ dt·6 every frame
      const height = standingHeight();

      const speed = p.crouch > 0.5 ? CROUCH : run ? RUN : WALK;
      const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw);
      wish.set(-sy * f + cy * r, 0, -cy * f - sy * r).multiplyScalar(speed);
      const lambda = p.grounded ? 11 : 1.5;
      vel.x = U.damp(vel.x, wish.x, lambda, dt);
      vel.z = U.damp(vel.z, wish.z, lambda, dt);

      // horizontal move with collision
      const px = pos.x, pz = pos.z;
      const hit = physics.move(pos, vel.x * dt, vel.z * dt, p.radius, height, p.stepUp).hit;
      const mdx = pos.x - px, mdz = pos.z - pz;
      if (hit && dt > 0) { vel.x = mdx / dt; vel.z = mdz / dt; }
      const moved = Math.hypot(mdx, mdz);

      // jump
      const jump = allowInput && input.isDown('Space');
      if (jump && !st.prevJump && p.grounded) {
        vel.y = JUMP_V; p.grounded = false; st.airborne = true;
        C.emit('jump', { surface: p.surface, speed: Math.hypot(vel.x, vel.z) });
      }
      st.prevJump = jump;

      // vertical
      if (p.grounded) {
        const g = physics.groundAt(pos.x, pos.z, pos.y, p.stepUp);
        if (g && g.y >= pos.y - STEP_DOWN) { pos.y = g.y; vel.y = 0; p.surface = g.surface; }
        else { p.grounded = false; vel.y = 0; }
      }
      if (!p.grounded) {
        vel.y -= GRAVITY * dt;
        pos.y += vel.y * dt;
        const g = physics.groundAt(pos.x, pos.z, pos.y, Math.max(p.stepUp, 0.6));
        if (g && pos.y <= g.y) {
          pos.y = g.y;
          if (vel.y <= 0) {
            const impact = -vel.y;
            p.grounded = true; vel.y = 0; p.surface = g.surface;
            if (impact > 1.2) {
              C.emit('land', { surface: g.surface, speed: impact });
              st.dipV -= Math.min(1.6, impact * 0.28);
            }
          }
        }
        const ceil = ceilingAt(pos.x, pos.z, pos.y);
        if (pos.y + height > ceil) { pos.y = Math.max(pos.y - 0.5, ceil - height); if (vel.y > 0) vel.y = 0; }
        if (pos.y < -30) {                           // fell out of the world
          const s = C.world.spawn;
          pos.set(s.x, s.y, s.z); vel.set(0, 0, 0); p.grounded = true;
        }
      }

      // footsteps + bob phase
      if (p.grounded && moved > 1e-5) {
        const stride = STEP_LEN * (run && p.crouch < 0.5 ? 1.25 : 1);
        const before = Math.floor(st.stepPhase);
        st.stepPhase += moved / stride;
        if (Math.floor(st.stepPhase) !== before) {
          C.emit('footstep', { surface: p.surface, run: run && p.crouch < 0.5, crouch: p.crouch > 0.5, x: pos.x, y: pos.y, z: pos.z });
        }
      }
      const hs = Math.hypot(vel.x, vel.z);
      st.bobAmp = U.damp(st.bobAmp, p.grounded ? Math.min(1, hs / WALK) : 0, 8, dt);
      st.running = run && hs > WALK + 0.3;
    }

    // ------------------------------------------------------------------ camera placement
    const rockT = { t: 0 };
    function placeCamera(dt, t) {
      let tx, ty, tz, yaw = p.yaw, pitch = p.pitch;
      if (p.mode === 'sit' && p.seat) {
        const s = p.seat, sp = s.position;
        tx = sp[0]; ty = sp[1]; tz = sp[2];
        if (s.rock) {
          rockT.t += dt;
          const w = Math.sin(rockT.t * Math.PI * 2 / 2.8);
          pitch += w * s.rock;
          tx += -Math.sin(s.yaw) * w * s.rock * 1.2; tz += -Math.cos(s.yaw) * w * s.rock * 1.2;
          ty += Math.abs(w) * s.rock * -0.4;
        }
        p.bob.set(0, 0, 0);
      } else if (p.mode === 'noclip') {
        tx = p.position.x; ty = p.position.y; tz = p.position.z;
        p.bob.set(0, 0, 0);
      } else {
        const eyeH = U.lerp(p.eyeHeight, p.crouchHeight - 0.1, p.crouch);
        // landing spring
        const k = 140, c = 2 * Math.sqrt(k) * 0.8;
        st.dipV += (-k * st.dip - c * st.dipV) * dt;
        st.dip += st.dipV * dt;
        // optional head bob (Settings, off by default): a small vertical bounce per step, perfectly still when idle
        let by = 0;
        if (C.settings.headBob) {
          const a = st.bobAmp * (st.running ? 1.3 : 1);
          by = -Math.cos(st.stepPhase * Math.PI * 2) * 0.007 * a;
        }
        p.bob.set(0, by + st.dip, 0);
        tx = p.position.x; ty = p.position.y + eyeH + by + st.dip; tz = p.position.z;
      }
      eye.set(tx, ty, tz);
      if (st.trans > 0) {
        st.trans -= dt;
        const k = 1 - Math.exp(-9 * dt);
        st.camPos.lerp(eye, k);
        st.camYaw += wrap(yaw - st.camYaw) * k;
        st.camPitch += (pitch - st.camPitch) * k;
        if (st.trans <= 0) { st.camPos.copy(eye); st.camYaw = yaw; st.camPitch = pitch; }
      } else {
        st.camPos.copy(eye); st.camYaw = yaw; st.camPitch = pitch;
      }
      cam.position.copy(st.camPos);
      cam.rotation.set(st.camPitch, st.camYaw, 0, 'YXZ');
    }

    // ------------------------------------------------------------------ look
    function look(dt) {
      const m = input.consumeMouse();
      if (!inputOn()) return;
      const sens = MOUSE_SENS * (C.settings.mouseSensitivity || 1);
      const inv = C.settings.invertY ? -1 : 1;
      p.yaw -= m.dx * sens + input.virtual.lookX * 2.4 * dt;
      p.pitch -= (m.dy * sens + input.virtual.lookY * 1.8 * dt) * inv;
      p.yaw = wrap(p.yaw);
      if (p.mode === 'sit' && p.seat) {
        const s = p.seat, range = s.yawRange ?? 1.4;
        const d = U.clamp(wrap(p.yaw - s.yaw), -range, range);
        p.yaw = wrap(s.yaw + d);
        p.pitch = U.clamp(p.pitch, s.pitchMin ?? -1.0, s.pitchMax ?? 1.2);
      } else p.pitch = U.clamp(p.pitch, -1.52, 1.52);
    }

    // ------------------------------------------------------------------ events
    C.on('sit', () => {
      const s = p.seat;
      if (!s) return;
      if (typeof s.yaw === 'number') p.yaw = s.yaw;
      p.pitch = typeof s.pitch === 'number' ? s.pitch : 0;
      st.sitTimer = 0; st.sitBlock = anyMoveDown(); rockT.t = 0;
      p.velocity.set(0, 0, 0); p.crouch = 0;
      startTransition();
    });
    C.on('stand', () => {
      p.grounded = true; st.airborne = false; p.velocity.set(0, 0, 0);
      const g = physics.groundAt(p.position.x, p.position.z, p.position.y + 0.1, 0.5);
      if (g) p.position.y = g.y;
      startTransition();
    });
    C.on('teleport', (e) => {
      st.trans = 0; p.velocity.set(0, 0, 0); st.dip = 0; st.dipV = 0;
      if (!e || !e.freecam) {
        const g = physics.groundAt(p.position.x, p.position.z, p.position.y + 0.05, 0.5);
        p.grounded = !!g && Math.abs(g.y - p.position.y) < 0.5;
        if (p.grounded) p.position.y = g.y;
      }
      placeCamera(0, C.time);
    });
    C.on('pause', () => { input.virtual.moveX = input.virtual.moveY = 0; });

    // ------------------------------------------------------------------ flashlight
    const flash = new THREE.SpotLight(0xfff2dd, 0, 28, 0.46, 0.55, 2);
    flash.name = 'player.flashlight';
    flash.position.set(0.18, -0.16, 0.05);
    flash.target.position.set(0.05, -0.1, -1);
    cam.add(flash); cam.add(flash.target);
    C.registerLight(flash, { id: 'flashlight', room: 'player', kind: 'spot' });
    // core only adds its fallback lights when the scene has none — the flashlight counts, so replicate them for
    // partial builds without the weather module (keeps test builds from rendering black)
    if (!C.modules.some(m => m.name === 'weather')) {
      const h = new THREE.HemisphereLight(0xdde6ff, 0x554433, 1.2); h.name = 'player.fallbackLight'; C.scene.add(h);
      const d = new THREE.DirectionalLight(0xffffff, 1.2); d.position.set(5, 10, 4); d.name = 'player.fallbackLight'; C.scene.add(d);
    }
    let flashLevel = 0;
    const setFlash = (on) => {
      st.flashlightOn = on;
      C.audio.play?.('switch', { volume: 0.5 });
      C.emit('flashlight', { on });
    };
    input.onKey('KeyF', () => setFlash(!st.flashlightOn));
    this.flash = flash;
    this.updateFlash = (dt) => {
      flashLevel = U.damp(flashLevel, st.flashlightOn ? 1 : 0, 18, dt);
      flash.intensity = flashLevel * 60;          // never toggle .visible (light count change = shader recompile)
    };

    // ------------------------------------------------------------------ spawn
    if (p.mode !== 'noclip') {
      const s = C.world.spawn;
      p.position.set(s.x, s.y, s.z); p.yaw = s.yaw; p.pitch = -0.05;
      const g = physics.groundAt(s.x, s.z, s.y + 0.1, 0.5);
      if (g) p.position.y = g.y;
    }
    p.grounded = true;
    st.camPos.set(p.position.x, p.position.y + p.eyeHeight, p.position.z);

    // ------------------------------------------------------------------ debug simulate
    C.debug.simulate = (opts = {}) => {
      const { from, yaw, pitch, keys = [], seconds = 1, dt = 1 / 60 } = opts;
      if (from) {
        if (p.mode === 'sit') p.seat = null;
        p.mode = 'walk';
        p.position.set(from[0], from[1], from[2]);
        p.velocity.set(0, 0, 0);
        const g = physics.groundAt(from[0], from[2], from[1] + 0.05, 0.5);
        p.grounded = !!g && Math.abs(g.y - from[1]) < 0.5;
        if (p.grounded) p.position.y = g.y;
        p.crouch = 0; st.dip = 0; st.dipV = 0;
      }
      if (typeof yaw === 'number') p.yaw = yaw;
      if (typeof pitch === 'number') p.pitch = pitch;
      const added = [];
      for (const k of keys) if (!input.virtualKeys.has(k)) { input.virtualKeys.add(k); added.push(k); }
      let maxY = p.position.y, minY = p.position.y;
      const n = Math.max(1, Math.round(seconds / dt));
      try {
        for (let i = 0; i < n; i++) {
          step(dt, true);
          if (p.position.y > maxY) maxY = p.position.y;
          if (p.position.y < minY) minY = p.position.y;
        }
      } finally {
        for (const k of added) input.virtualKeys.delete(k);
      }
      st.trans = 0;
      placeCamera(0, C.time);
      return { x: p.position.x, y: p.position.y, z: p.position.z, maxY, minY, grounded: p.grounded, mode: p.mode, surface: p.surface };
    };

    this.step = step;
    this.look = look;
    this.placeCamera = placeCamera;
    placeCamera(0, 0);

    // ------------------------------------------------------------------ touch controls
    if (input.isTouch) buildTouchUI(C, st);
  },

  update(dt, t) {
    this.look(dt);
    this.step(dt, false);
    this.updateFlash(dt);
    this.placeCamera(dt, t);
  },
});

// =====================================================================================================================
//  Touch UI: left dynamic joystick (move), right-side drag (look), Use / Jump / Crouch buttons, pause button.
// =====================================================================================================================
function buildTouchUI(C, st) {
  const input = C.input;
  const css = document.createElement('style');
  css.textContent = `
#cozy-touch{position:fixed;inset:0;z-index:40;pointer-events:none;display:none;font-family:Georgia,serif;color:#fbf1e1}
#cozy-touch.on{display:block}
#cozy-touch .zone{position:absolute;top:0;bottom:0;pointer-events:auto;touch-action:none}
#cozy-touch .zl{left:0;width:42%}
#cozy-touch .zr{right:0;width:58%}
#cozy-touch .stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,236,205,.35);background:rgba(40,28,20,.18);display:none}
#cozy-touch .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,236,205,.35);box-shadow:0 0 12px rgba(0,0,0,.35)}
#cozy-touch .btn{position:absolute;pointer-events:auto;touch-action:none;width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,236,205,.5);background:rgba(40,28,20,.35);display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none}
#cozy-touch .btn.act{background:rgba(255,200,140,.35)}
#cozy-touch .use{right:28px;bottom:120px;width:78px;height:78px;font-size:16px}
#cozy-touch .jump{right:120px;bottom:40px}
#cozy-touch .crouch{right:28px;bottom:32px;width:58px;height:58px;font-size:12px}
#cozy-touch .pause{right:14px;top:14px;width:44px;height:44px;font-size:15px}
`;
  document.head.appendChild(css);
  const root = document.createElement('div');
  root.id = 'cozy-touch';
  root.innerHTML = '<div class="zone zl"></div><div class="zone zr"></div><div class="stick"><div class="knob"></div></div>' +
    '<div class="btn use">Use</div><div class="btn jump">Jump</div><div class="btn crouch">Crouch</div><div class="btn pause">❚❚</div>';
  document.body.appendChild(root);
  const zl = root.querySelector('.zl'), zr = root.querySelector('.zr'), stick = root.querySelector('.stick'), knob = root.querySelector('.knob');
  const R = 52;
  let moveId = null, ox = 0, oy = 0, lookId = null, lx = 0, ly = 0;

  zl.addEventListener('touchstart', e => {
    e.preventDefault();
    const tt = e.changedTouches[0];
    moveId = tt.identifier; ox = tt.clientX; oy = tt.clientY;
    stick.style.left = ox + 'px'; stick.style.top = oy + 'px'; stick.style.display = 'block';
    knob.style.transform = 'translate(0,0)';
  }, { passive: false });
  const moveTouch = e => {
    for (const tt of e.changedTouches) {
      if (tt.identifier === moveId) {
        let dx = tt.clientX - ox, dy = tt.clientY - oy;
        const d = Math.hypot(dx, dy);
        if (d > R) { dx *= R / d; dy *= R / d; }
        knob.style.transform = `translate(${dx}px,${dy}px)`;
        input.virtual.moveX = dx / R; input.virtual.moveY = -dy / R;
      } else if (tt.identifier === lookId) {
        input.mouse.dx += (tt.clientX - lx) * 2.2; input.mouse.dy += (tt.clientY - ly) * 2.2;
        lx = tt.clientX; ly = tt.clientY;
      }
    }
  };
  const endTouch = e => {
    for (const tt of e.changedTouches) {
      if (tt.identifier === moveId) { moveId = null; stick.style.display = 'none'; input.virtual.moveX = 0; input.virtual.moveY = 0; }
      if (tt.identifier === lookId) lookId = null;
    }
  };
  zr.addEventListener('touchstart', e => {
    e.preventDefault();
    const tt = e.changedTouches[0];
    lookId = tt.identifier; lx = tt.clientX; ly = tt.clientY;
  }, { passive: false });
  for (const el of [zl, zr]) {
    el.addEventListener('touchmove', e => { e.preventDefault(); moveTouch(e); }, { passive: false });
    el.addEventListener('touchend', endTouch); el.addEventListener('touchcancel', endTouch);
  }
  // consumeMouse only reports while pointer-locked on desktop; on touch we feed input.mouse directly (core reads it)
  const btn = (sel, down, up) => {
    const el = root.querySelector(sel);
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('act'); down(); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); el.classList.remove('act'); if (up) up(); }, { passive: false });
    return el;
  };
  btn('.use', () => {
    if (!C.state.started || C.state.paused) return;
    if (C.interact.focused) C.interact.useFocused();
    else if (C.player.mode === 'sit') C.player.stand();
  });
  btn('.jump', () => input.virtualKeys.add('Space'), () => input.virtualKeys.delete('Space'));
  const cb = btn('.crouch', () => { st.touchCrouch = !st.touchCrouch; });
  btn('.pause', () => C.pause());
  const sync = () => {
    root.classList.toggle('on', C.state.started && !C.state.paused);
    cb.classList.toggle('act', st.touchCrouch);
  };
  ['start', 'pause', 'resume'].forEach(ev => C.on(ev, sync));
  sync();
}

</script>
<script type="module" data-module="weather">
// =====================================================================================================================
//  WEATHER — sky, fog, sky light, time of day, rain, drips, splashes, lightning, chimney smoke, rain-on-glass.
//  (SPEC §9 weather, §3.10, §4.8, §5)                                                              module order 30
// ---------------------------------------------------------------------------------------------------------------------
//  Public API  (C.weather)
//    setPreset(name, {instant, silent})   'afternoon' | 'dusk' | 'night'   (T key cycles; ?time=)
//    cycleTime()                          afternoon → dusk → night → afternoon (toast + 'timeofday' event)
//    setRain(level, {instant, silent})    0..1 (0 = dry). Presets: drizzle 0.35, rain 0.7, storm 1.0 (?rain=)
//    cycleRain()                          drizzle → rain → storm → drizzle (toast + 'rain' event)
//    lightning({strength, distance, dirX, dirZ, bolt})   trigger a strike now (also C.debug.lightning(opts))
//    setLightningEnabled(bool)            random strikes on/off (?lightning=0 disables them)
//    applyGlass(mesh) / refreshGlass()    put the rain-on-glass shader on a pane (all of C.house.glassPanes are
//                                         picked up automatically at init, on 'ready' and when the list grows)
//    get preset / get rain / presets / rainLevels / lights {hemi, dir, window[]} / uniforms (shared, read-only)
//  Writes every frame: C.env.preset, daylight (smoothed 0..1), rain (smoothed 0..1), wind {x,z} (same object,
//    m/s-ish, gusty), lightningFlash (0..1+), indoor (smoothed C.world.indoorAmount at the camera).
//  Events emitted: 'timeofday' {preset, daylight(target)}, 'rain' {level}, 'lightning' {strength, distance(km), dirX,
//    dirZ} (+ on 'ready' one 'timeofday' and one 'rain' so listeners can sync). Consumed: 'teleport', 'settings', 'ready'.
//  Draw calls: sky 1, rain 1, splashes 1 (ground + drip + downspout splashes), drips 1 (eaves, porch roof, downspout
//    gushes), smoke 1, bolt 1 (only while a bolt is visible), + 1 per glass pane (house meshes, material swapped).
//  Rain/splash occlusion = GLSL copy of the SPEC §4.8 occluders (identical to C.world.isUnderRoof).
// =====================================================================================================================
import * as THREE from 'three';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
const C = window.COZY;

// ---------------------------------------------------------------------------------------------------------------------
// Presets (colours are sRGB hex; converted to linear by THREE.Color)
// ---------------------------------------------------------------------------------------------------------------------
const PRESETS = {
  afternoon: {
    daylight: 0.8, toast: 'Afternoon — soft grey light',
    zenith: 0x7f8a98, cloudLight: 0xa3abb6, cloudDark: 0x6c7582, horizon: 0x939ca7, glow: 0x000000,
    fog: 0x939ca7, fogOut: 0.021, fogIn: 0.010,
    hemiSky: 0xc4cfdc, hemiGround: 0x4b4a3f, hemi: 2.1, dirColor: 0xdfe6ef, dir: 1.25,
    winColor: 0xb7c7dc, win: 2.2, rain: 0xb4bdc8, rainBright: 1.1,
  },
  dusk: {
    daylight: 0.45, toast: 'Dusk — the lamps glow warmer',
    zenith: 0x2e3848, cloudLight: 0x4d596b, cloudDark: 0x262e3b, horizon: 0x4f5a6b, glow: 0x0a0806,
    fog: 0x4f5a6b, fogOut: 0.027, fogIn: 0.010,
    hemiSky: 0x7c8eaa, hemiGround: 0x2b2b28, hemi: 1.35, dirColor: 0x9cadc9, dir: 0.5,
    winColor: 0x8ea3c2, win: 1.1, rain: 0x8390a3, rainBright: 1.0,
  },
  night: {
    daylight: 0.1, toast: 'Night — rain in the dark',
    zenith: 0x080b12, cloudLight: 0x1a2130, cloudDark: 0x0b0e15, horizon: 0x1b2230, glow: 0x1c1208,
    fog: 0x1b2230, fogOut: 0.03, fogIn: 0.010,
    hemiSky: 0x40527a, hemiGround: 0x121212, hemi: 0.55, dirColor: 0x6c83b5, dir: 0.14,
    winColor: 0x4a5f88, win: 0.25, rain: 0x4c5870, rainBright: 0.8,
  },
};
const PRESET_ORDER = ['afternoon', 'dusk', 'night'];
const RAIN_LEVELS = [
  { name: 'drizzle', level: 0.35, toast: 'A soft drizzle' },
  { name: 'rain', level: 0.7, toast: 'Steady rain' },
  { name: 'storm', level: 1.0, toast: 'A storm rolls in' },
];
const INDOOR_HEMI = 0.08, INDOOR_DIR = 0.06;         // sky light multipliers when the camera is fully indoors
const GROUND_Y = -0.45;
const OUTLETS = [[7.1, -5.15], [-7.1, -5.15], [7.1, 5.15], [-7.1, 5.15]];

// ---------------------------------------------------------------------------------------------------------------------
// GLSL snippets
// ---------------------------------------------------------------------------------------------------------------------
const GLSL_HASH = /* glsl */`
float hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash21(float p) { vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3 hash31(float p) { vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
`;
// SPEC §4.8 occluders — keep identical to C.world.isUnderRoof
const GLSL_OCCLUDE = /* glsl */`
bool underRoof(vec3 p) {
  vec3 a = abs(p);
  if (a.x <= 7.4 && a.z <= 5.6 && p.y < 7.77 - 0.7 * a.z) return true;
  if (p.x >= -7.9 && p.x <= -7.0 && p.z >= 1.8 && p.z <= 3.2 && p.y < 8.4) return true;
  if (p.x >= 1.0 && p.x <= 7.0 && p.z >= 5.0 && p.z <= 7.4 && p.y < 3.27 - 0.25 * (p.z - 5.0)) return true;
  return false;
}
`;
const HIDE = 'gl_Position = vec4(2.0, 2.0, 2.0, 1.0);';

// ---------------------------------------------------------------------------------------------------------------------
C.register({
  name: 'weather',
  order: 30,
  init(C) {
    const U = C.util, P = C.params;
    const root = new THREE.Group(); root.name = 'weather';
    C.scene.add(root);
    const rnd = U.rng(4242);

    // ------------------------------------------------------------------ state
    const startPreset = PRESETS[P.get('time')] ? P.get('time') : 'dusk';
    let rainParam = parseFloat(P.get('rain'));
    const startRain = isFinite(rainParam) ? U.clamp(rainParam, 0, 1) : 0.7;
    const st = {
      preset: startPreset, blendFrom: startPreset, blend: 1,           // preset cross-fade 0..1
      rainTarget: startRain, rain: startRain,
      lightningOn: P.get('lightning') !== '0',
      nextStrike: 18 + rnd() * 20,
      indoor: 1, daylight: PRESETS[startPreset].daylight,
      fire: 1, windPhase: rnd() * 100,
    };
    const env = C.env;
    env.preset = startPreset; env.rain = startRain; env.daylight = st.daylight;
    if (!env.wind) env.wind = { x: 0.35, z: 0.15 };

    // current blended preset values (linear colours)
    const cur = {};
    const colKeys = ['zenith', 'cloudLight', 'cloudDark', 'horizon', 'glow', 'fog', 'hemiSky', 'hemiGround', 'dirColor', 'winColor', 'rain'];
    const numKeys = ['daylight', 'fogOut', 'fogIn', 'hemi', 'dir', 'win', 'rainBright'];
    const presetCols = {};
    for (const k of Object.keys(PRESETS)) {
      presetCols[k] = {};
      for (const c of colKeys) presetCols[k][c] = new THREE.Color(PRESETS[k][c]);
    }
    for (const c of colKeys) cur[c] = new THREE.Color();
    function blendPresets() {
      const a = PRESETS[st.blendFrom], b = PRESETS[st.preset], ca = presetCols[st.blendFrom], cb = presetCols[st.preset];
      const t = st.blend * st.blend * (3 - 2 * st.blend);
      for (const c of colKeys) cur[c].copy(ca[c]).lerp(cb[c], t);
      for (const n of numKeys) cur[n] = a[n] + (b[n] - a[n]) * t;
    }
    blendPresets();

    // ------------------------------------------------------------------ shared uniforms
    const uni = {
      time: { value: 0 }, rain: { value: startRain }, flash: { value: 0 },
      flashDir: { value: new THREE.Vector3(0, 0.3, -1).normalize() }, flashCol: { value: new THREE.Color(0xc9d6ff) },
      fogColor: { value: new THREE.Color() }, fogDensity: { value: 0.02 },
      day: { value: st.daylight }, indoor: { value: 1 },
      pix: { value: 0.001 },
      zenith: { value: cur.zenith }, horizon: { value: cur.horizon }, cloudLight: { value: cur.cloudLight },
      cloudDark: { value: cur.cloudDark }, glow: { value: cur.glow },
    };

    // ------------------------------------------------------------------ fog
    C.scene.fog = new THREE.FogExp2(cur.fog.getHex(), cur.fogOut);
    C.scene.background = cur.horizon.clone();

    // ------------------------------------------------------------------ lights
    const hemi = new THREE.HemisphereLight(cur.hemiSky, cur.hemiGround, cur.hemi);
    hemi.name = 'weather.hemi';
    root.add(hemi);
    const dir = new THREE.DirectionalLight(cur.dirColor, cur.dir);
    dir.name = 'weather.key';
    const DIR_BASE = new THREE.Vector3(-5, 12, 7);
    dir.position.copy(DIR_BASE);
    dir.target.position.set(0, 0, 0);
    root.add(dir, dir.target);
    C.registerLight(hemi, { id: 'sky_hemi', room: 'outside', kind: 'hemisphere' });
    C.registerLight(dir, { id: 'sky_key', room: 'outside', kind: 'directional' });
    // soft cool window light (RectAreaLight) on the big living-room window
    const windowLights = [];
    if (P.get('winlight') !== '0') {
      try {
        RectAreaLightUniformsLib.init();
        const defs = [{ id: 'window_living_s', w: 2.5, h: 1.65, pos: [-3.9, 1.43, 4.72], look: [-3.9, 1.1, 0], k: 1 }];
        for (const d of defs) {
          const l = new THREE.RectAreaLight(cur.winColor, cur.win, d.w, d.h);
          l.position.set(d.pos[0], d.pos[1], d.pos[2]);
          l.lookAt(d.look[0], d.look[1], d.look[2]);
          l.name = 'weather.' + d.id; l.userData.k = d.k;
          root.add(l);
          C.registerLight(l, { id: d.id, room: 'living', kind: 'rectarea' });
          windowLights.push(l);
        }
      } catch (e) { C.log('weather', 'rect lights unavailable', e); }
    }

    // ------------------------------------------------------------------ helpers: quad-particle geometry
    function quadGeometry(n, attrs) {
      // attrs: { name: [itemSize, fn(i, out[]) ] } per-particle values replicated on the 4 corners
      const g = new THREE.BufferGeometry();
      const corner = new Float32Array(n * 8);
      const idx = new Uint32Array(n * 6);
      const cs = [-1, 0, 1, 0, 1, 1, -1, 1];
      for (let i = 0; i < n; i++) {
        corner.set(cs, i * 8);
        const v = i * 4, o = i * 6;
        idx[o] = v; idx[o + 1] = v + 1; idx[o + 2] = v + 2; idx[o + 3] = v; idx[o + 4] = v + 2; idx[o + 5] = v + 3;
      }
      g.setAttribute('aCorner', new THREE.BufferAttribute(corner, 2));
      // three needs a position attribute for bookkeeping; the vertex shaders ignore it
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 12), 3));
      const tmp = [0, 0, 0, 0];
      for (const name of Object.keys(attrs)) {
        const [size, fn] = attrs[name];
        const arr = new Float32Array(n * 4 * size);
        for (let i = 0; i < n; i++) {
          fn(i, tmp);
          for (let c = 0; c < 4; c++) for (let k = 0; k < size; k++) arr[(i * 4 + c) * size + k] = tmp[k];
        }
        g.setAttribute(name, new THREE.BufferAttribute(arr, size));
      }
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);
      return g;
    }
    const OUT_CHUNKS = '#include <tonemapping_fragment>\n#include <colorspace_fragment>';

    // =================================================================================================================
    // SKY DOME
    // =================================================================================================================
    const skyMat = new THREE.ShaderMaterial({
      name: 'weather.sky',
      uniforms: {
        uTime: uni.time, uFlash: uni.flash, uFlashDir: uni.flashDir, uFlashCol: uni.flashCol,
        uZenith: uni.zenith, uHorizon: uni.horizon, uCloudLight: uni.cloudLight, uCloudDark: uni.cloudDark, uGlow: uni.glow,
        uOff1: { value: new THREE.Vector2(3.1, 7.7) }, uOff2: { value: new THREE.Vector2(1.3, 2.9) }, uOff3: { value: new THREE.Vector2(5.5, 0.4) },
        uRain: uni.rain,
      },
      vertexShader: /* glsl */`
        varying vec3 vDir;
        void main() {
          vDir = position;
          vec4 p = projectionMatrix * viewMatrix * vec4(cameraPosition + position, 1.0);
          gl_Position = vec4(p.xy, p.w * 0.99999, p.w);
        }`,
      fragmentShader: /* glsl */`
        ${GLSL_HASH}
        uniform float uTime, uFlash, uRain;
        uniform vec3 uFlashDir, uFlashCol, uZenith, uHorizon, uCloudLight, uCloudDark, uGlow;
        uniform vec2 uOff1, uOff2, uOff3;
        varying vec3 vDir;
        float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.07 + vec2(1.7, 9.2); a *= 0.5; } return s; }
        void main() {
          vec3 d = normalize(vDir);
          float h = d.y;
          float hc = max(h, 0.0);
          vec2 uv = d.xz / (hc + 0.12);
          float big = fbm(uv * 0.16 + uOff1);
          float det = fbm(uv * 0.55 + uOff2 + big * 0.8);
          float scud = fbm(uv * 0.3 + uOff3);
          float dens = clamp(big * 1.05 + det * 0.55 - 0.42 + uRain * 0.12, 0.0, 1.0);
          vec3 cl = mix(uCloudLight, uCloudDark, smoothstep(0.15, 0.85, dens));
          cl = mix(cl, uCloudDark * 0.75, smoothstep(0.5, 0.78, scud) * 0.55);
          cl = mix(cl, uZenith, smoothstep(0.35, 1.0, h) * 0.35);
          vec3 col = mix(uHorizon, cl, smoothstep(0.0, 0.3, h));
          col += uGlow * exp(-hc * 9.0);
          // lightning: clouds lit from inside around the strike direction + general sky brightening
          float fd = max(dot(d, uFlashDir), 0.0);
          float g = pow(fd, 10.0) * (0.5 + 1.8 * dens) + pow(fd, 3.0) * 0.35 + 0.1;
          col += uFlashCol * uFlash * g * (0.6 + 0.8 * det);
          gl_FragColor = vec4(col, 1.0);
          ${OUT_CHUNKS}
        }`,
      side: THREE.BackSide, depthWrite: false, fog: false,
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), skyMat);
    sky.name = 'weather.sky'; sky.frustumCulled = false; sky.renderOrder = -1000;
    sky.userData.dynamic = true;
    root.add(sky);

    // =================================================================================================================
    // RAIN STREAKS
    // =================================================================================================================
    const RAIN_MAX = 12000;
    const BOX = new THREE.Vector3(26, 14, 26);
    const rainGeo = quadGeometry(RAIN_MAX, { aSeed: [4, (i, o) => { o[0] = rnd(); o[1] = rnd(); o[2] = rnd(); o[3] = rnd(); }] });
    const rainOffsets = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
    const rainLPos = [new THREE.Vector3(0, -999, 0), new THREE.Vector3(0, -999, 0), new THREE.Vector3(0, -999, 0), new THREE.Vector3(0, -999, 0)];
    const rainLCol = [new THREE.Color(0), new THREE.Color(0), new THREE.Color(0), new THREE.Color(0)];
    const rainMat = new THREE.ShaderMaterial({
      name: 'weather.rain',
      uniforms: {
        uOff: { value: rainOffsets }, uBox: { value: BOX }, uBottom: { value: -1 },
        uDir: { value: new THREE.Vector3(0, -1, 0) }, uLen: { value: 0.45 }, uWidth: { value: 0.01 },
        uPix: uni.pix, uOpacity: { value: 0.3 }, uAmb: { value: new THREE.Color(0.1, 0.1, 0.1) },
        uLPos: { value: rainLPos }, uLCol: { value: rainLCol },
        uFogColor: uni.fogColor, uFogDensity: uni.fogDensity,
      },
      vertexShader: /* glsl */`
        ${GLSL_OCCLUDE}
        attribute vec4 aSeed;
        attribute vec2 aCorner;
        uniform vec3 uOff[4];
        uniform vec3 uBox, uDir, uAmb, uFogColor;
        uniform float uBottom, uLen, uWidth, uPix, uOpacity, uFogDensity;
        uniform vec3 uLPos[4];
        uniform vec3 uLCol[4];
        varying vec2 vUv; varying float vA; varying vec3 vCol;
        void main() {
          int k = int(aSeed.w * 3.999);
          vec3 p = aSeed.xyz * uBox + uOff[k];
          vec3 h;
          h.xz = cameraPosition.xz + mod(p.xz - cameraPosition.xz + 0.5 * uBox.xz, uBox.xz) - 0.5 * uBox.xz;
          h.y = uBottom + mod(p.y - uBottom, uBox.y);
          float r2 = fract(aSeed.w * 37.17);
          float len = uLen * (0.6 + 0.8 * r2) * (0.85 + 0.1 * float(k));
          vec3 pos = h - uDir * (len * aCorner.y);
          vec3 toCam = cameraPosition - pos;
          float dist = length(toCam);
          vec3 side = normalize(cross(uDir, toCam));
          float w = uWidth * (0.6 + 0.8 * fract(aSeed.w * 91.3));
          float px = dist * uPix * 1.2;
          float we = max(w, px);
          float a = w / we;
          pos += side * (aCorner.x * 0.5 * we);
          float hd = length(h.xz - cameraPosition.xz);
          a *= 1.0 - smoothstep(0.34 * uBox.x, 0.5 * uBox.x, hd);
          a *= smoothstep(0.3, 1.6, dist);
          float fy = (h.y - uBottom) / uBox.y;
          a *= smoothstep(0.0, 0.05, fy) * (1.0 - smoothstep(0.82, 1.0, fy));
          float ff = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
          vec3 col = uAmb;

  applySettings(); applyMute();

}
function onFootstep(p) {

  const s = SURF[p.surface] || 'wood';
  const buf = getBuf(`step_${s}_${(Math.random() * STEP_VARIANTS) | 0}`);
  const g = STEP_GAIN[s] * (p.run ? 1.3 : 1) * (p.crouch ? 0.45 : 1) * mr(0.8, 1.05) * (p.volume === undefined ? 1 : p.volume);

  const creakP = s === 'wood' ? 0.07 : s === 'stairs' ? 0.14 : s === 'porch' ? 0.06 : 0;
  if (creakP && Math.random() < creakP * (p.crouch ? 1.5 : 1)) {

}
function onJump(p) {

}
function onLand(p) {
  if (!ctx) return;
  const sp = p && isFinite(p.speed) ? p.speed : 3.5, s = SURF[(p && p.surface) || C.player.surface] || 'wood', k = clamp(sp / 4.5, 0.4, 1.5);
  const b = () => getBuf(`step_${s}_${(Math.random() * STEP_VARIANTS) | 0}`);
  voice(b(), { out: stepPanL, gain: STEP_GAIN[s] * 1.15 * k, rate: mr(0.82, 0.9) });
  voice(b(), { out: stepPanR, gain: STEP_GAIN[s] * 0.8 * k, rate: mr(0.85, 0.95), when: ctx.currentTime + 0.035 });

}
function onLightning(p) {

  const at = ctx.currentTime + delay;

function onDoor(p) {

function onSit(p) {

// ---------------------------------------------------------------------------------------------------------------------

  const l = ctx.listener;

    setP(l.forwardX, fx, 0.02); setP(l.forwardY, fy, 0.02); setP(l.forwardZ, fz, 0.02);
    setP(l.upX, ux, 0.02); setP(l.upY, uy, 0.02); setP(l.upZ, uz, 0.02);

function mixRain() {

function mixFire(dt) {
  if (!layers.fireBed) return;
  const tgt = clamp(C.env && isFinite(C.env.fireLevel) ? C.env.fireLevel : fireEvt, 0, 1.5);
  fireS += (tgt - fireS) * (1 - Math.exp(-dt * 1.5));

const PI = Math.PI;
const FIRE_CD = 9;

const FLAME_VS = /* glsl */`
varying vec2 vUv;
void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

const FLAME_FS = /* glsl */`
uniform float uTime; uniform float uLevel; uniform float uSeed;
varying vec2 vUv;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.07 + 13.1; a *= 0.5; } return v; }
void main() {
  float lv = clamp(uLevel, 0.0, 1.6);
  float t = uTime * 1.3;
  float n1 = fbm(vec2(vUv.x * 3.2 + uSeed * 7.0, vUv.y * 2.6 - t * 1.9));
  float n2 = fbm(vec2(vUv.x * 6.5 - uSeed * 3.0, vUv.y * 4.8 - t * 3.1));
  float x = (vUv.x - 0.5) * 2.0;
  float top = mix(0.3, 0.85, clamp(lv, 0.0, 1.0)) + 0.25 * clamp(lv - 1.0, 0.0, 0.6);
  float yy = vUv.y / max(top, 0.05);
  float sway = (n1 - 0.5) * 0.6 * yy;
  float w = mix(0.95, 0.06, pow(clamp(yy, 0.0, 1.0), 0.7));
  float body = 1.0 - smoothstep(w * 0.4, w, abs(x + sway));
  float fade = 1.0 - smoothstep(0.4, 1.05, yy + (n2 - 0.5) * 0.55);
  float f = body * fade * smoothstep(0.0, 0.1, vUv.y) * (0.5 + 0.95 * n2);
  f = clamp(f, 0.0, 1.25);
  vec3 col = mix(vec3(0.5, 0.05, 0.01), vec3(1.0, 0.34, 0.05), smoothstep(0.05, 0.45, f));
  col = mix(col, vec3(1.0, 0.8, 0.45), smoothstep(0.6, 1.05, f) * (1.0 - yy * 0.55));
  float a = smoothstep(0.03, 0.25, f) * min(lv, 1.0);
  gl_FragColor = vec4(col * f * 1.55 * a, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const SPARK_VS = /* glsl */`
uniform float uTime; uniform float uLevel; uniform float uPx;
attribute float aSeed;
varying float vA;
void main() {
  float speed = 0.3 + aSeed * 0.35;
  float cyc = uTime * speed + aSeed * 7.13;
  float life = fract(cyc);
  vec3 p = position;
  p.y += life * (0.45 + aSeed * 0.55);
  p.x += sin(aSeed * 40.0 + uTime * 3.0) * 0.05 * life;
  p.z += cos(aSeed * 23.0 + uTime * 2.3) * 0.08 * life;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  float on = step(0.6, fract(aSeed * 13.7 + floor(cyc) * 0.618));
  vA = (1.0 - life) * smoothstep(0.0, 0.06, life) * on * clamp(uLevel - 0.15, 0.0, 1.4);
  gl_PointSize = (0.006 + 0.014 * (1.0 - life)) * uPx / max(0.2, -mv.z);
}`;

const SPARK_FS = /* glsl */`
varying float vA;
void main() {
  vec2 c = gl_PointCoord - 0.5; float d = dot(c, c);
  if (d > 0.25 || vA < 0.01) discard;
  gl_FragColor = vec4(vec3(1.0, 0.55, 0.18) * (1.0 - d * 4.0) * vA * 2.0, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

// a door hides what is behind it only once the leaf has actually swung shut
const doorShut = d => !!d && !d.isOpen && Math.abs(d.angle || 0) < 0.03;

// invisible pick volume (material.visible = false → never drawn, still raycastable, survives baking)
function proxyBox(parent, mat, x0, y0, z0, x1, y1, z1, name) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.name = name;
  m.userData.dynamic = true;
  parent.add(m);
  return m;
}

// pillow inside its own yaw group so the lean happens about the pillow's own X axis
function pillowAt(parent, x, y, z, yaw, lean, o) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = yaw;
  parent.add(g);
  C.props.pillow(Object.assign({ parent: g, position: [0, 0, 0], rotation: [lean, 0, o.roll || 0] }, o));
  return g;
}

// log lying along local Z (then yawed): bark side + two end-grain caps
function logMesh(parent, M, len, r, x, y, z, ry, tilt) {
  const U = C.util;
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.set(0, ry || 0, tilt || 0);
  const inner = new THREE.Group();
  inner.rotation.x = PI / 2;
  g.add(inner);
  U.cyl(inner, r, r * 1.05, len, M.bark, 0, 0, 0, { radial: 12, open: true, uv: 'world', uvScale: 3 });
  for (const s of [-1, 1]) {
    const cap = new THREE.Mesh(new THREE.CircleGeometry(r * 0.99 * (s > 0 ? 1 : 1.05), 12), M.logEnd);
    cap.position.y = s * len / 2;
    cap.rotation.x = -s * PI / 2;
    cap.receiveShadow = true;
    inner.add(cap);
  }
  parent.add(g);
  return g;
}

function curtainGeo(width, height, folds, amp, seed) {
  const g = new THREE.PlaneGeometry(width, height, Math.max(16, folds * 8), 8);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) / width + 0.5, v = p.getY(i) / height + 0.5;
    const z = Math.sin(u * folds * 2 * PI + seed) * amp * (0.8 + 0.35 * (1 - v)) + C.util.noise2D(u * 5 + seed, v * 3) * 0.006;
    p.setZ(i, z);
  }
  g.computeVertexNormals();
  return g;
}

function buildSofa(parent, M, x, z, ry) {
  const U = C.util;
  const g = new THREE.Group();
  g.name = 'living.sofa';
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  parent.add(g);
  const W = 2.1, D = 0.92, f = M.sofa;
  U.box(g, W - 0.06, 0.2, D - 0.08, f, 0, 0.19, 0, { round: 0.04, segments: 3 });
  for (const s of [-1, 1]) {
    U.box(g, 0.22, 0.46, D, f, s * (W / 2 - 0.11), 0.33, 0, { round: 0.06, segments: 3 });
    U.cyl(g, 0.11, 0.11, D - 0.01, f, s * (W / 2 - 0.11), 0.56, 0, { rx: PI / 2, radial: 20 });
  }
  U.box(g, W - 0.38, 0.58, 0.22, f, 0, 0.56, -D / 2 + 0.12, { round: 0.07, segments: 3 });
  const cw = (W - 0.44) / 3;
  for (let i = 0; i < 3; i++) {
    const cx = -W / 2 + 0.22 + cw * (i + 0.5);
    U.box(g, cw - 0.012, 0.16, D - 0.27, f, cx, 0.37, 0.1, { round: 0.055, segments: 3 });
    U.box(g, cw - 0.02, 0.4, 0.17, f, cx, 0.64, -D / 2 + 0.31, { round: 0.075, segments: 3, rx: -0.13 });
  }
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) U.cyl(g, 0.024, 0.017, 0.09, M.dark, sx * (W / 2 - 0.09), 0.045, sz * (D / 2 - 0.09), { radial: 10 });
  pillowAt(g, -0.7, 0.63, -0.06, 0.7, -0.25, { w: 0.44, h: 0.44, t: 0.14, color: 0xd09a3a });
  pillowAt(g, 0.7, 0.63, -0.06, -0.7, -0.25, { w: 0.44, h: 0.44, t: 0.14, color: 0xefe6d4 });
  pillowAt(g, 0.42, 0.6, -0.1, -0.25, -0.2, { w: 0.36, h: 0.3, t: 0.12, color: 0x2f3d5a });
  // knit throw draped over the back (hangs down the back side, visible from the hall)
  C.props.throwBlanket({ parent: g, w: 0.95, d: 0.5, material: 'knit', position: [0.28, 0.84, -0.514], rotationY: PI, drapeOver: 0.35, seed: 3 });
  U.blobShadow(g, 0, 0, 0, W + 0.25, D + 0.25, 0.45);
  castShadows(g);
  return g;
}

function buildArmchair(parent, M, x, z, ry) {
  const U = C.util;
  const g = new THREE.Group();
  g.name = 'living.armchair';
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  parent.add(g);
  const W = 0.88, D = 0.86, f = M.chair;
  U.box(g, W - 0.06, 0.2, D - 0.08, f, 0, 0.22, 0.01, { round: 0.04, segments: 3 });
  U.box(g, W - 0.32, 0.14, D - 0.26, f, 0, 0.385, 0.09, { round: 0.05, segments: 3 });
  for (const s of [-1, 1]) {
    U.box(g, 0.16, 0.4, D - 0.1, f, s * (W / 2 - 0.08), 0.34, 0.04, { round: 0.06, segments: 3 });
    U.cyl(g, 0.08, 0.08, D - 0.12, f, s * (W / 2 - 0.08), 0.54, 0.04, { rx: PI / 2, radial: 16 });
  }
  const back = new THREE.Group();
  back.position.set(0, 0.12, -D / 2 + 0.1);
  back.rotation.x = -0.1;
  g.add(back);
  U.box(back, W - 0.1, 0.98, 0.17, f, 0, 0.49, 0, { round: 0.07, segments: 3 });
  for (const s of [-1, 1]) U.box(back, 0.12, 0.46, 0.34, f, s * (W / 2 - 0.07), 0.74, 0.16, { round: 0.05, segments: 3, ry: -s * 0.2 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) U.cyl(g, 0.022, 0.016, 0.12, M.dark, sx * (W / 2 - 0.08), 0.06, sz * (D / 2 - 0.08), { radial: 10 });
  pillowAt(g, 0, 0.64, -D / 2 + 0.27, 0, -0.18, { w: 0.4, h: 0.3, t: 0.12, color: 0x3d5a45 });
  U.blobShadow(g, 0, 0, 0, W + 0.2, D + 0.2, 0.42);
  castShadows(g);
  return g;
}

// big furniture facing the fire casts shadows from the fire light (quality high)
function castShadows(g) {
  g.traverse(o => { if (o.isMesh && o.name !== 'blobShadow') o.castShadow = true; });
}

// bookcase in local space: back at z = 0, front at z = D, facing +Z
function buildBookcase(parent, M, x, zWall, ry, W, D, H, seed) {
  const U = C.util, P = C.props;
  const g = new THREE.Group();
  g.name = 'living.bookcase';
  g.position.set(x, 0, zWall);
  g.rotation.y = ry;
  parent.add(g);
  const t = 0.03, wood = M.dark;
  U.boxAt(g, -W / 2, 0, 0, -W / 2 + t, H, D, wood);
  U.boxAt(g, W / 2 - t, 0, 0, W / 2, H, D, wood);
  U.boxAt(g, -W / 2 - 0.02, H, 0, W / 2 + 0.02, H + 0.04, D + 0.025, wood, { round: 0.008 });
  U.boxAt(g, -W / 2 + t, 0, D - 0.025, W / 2 - t, 0.09, D - 0.005, wood);
  U.boxAt(g, -W / 2 + t, 0.09, 0, W / 2 - t, H, 0.012, M.oak);
  U.boxAt(g, -0.015, 0.09, 0.012, 0.015, H, D, wood);
  const levels = [0.09, 0.5, 0.91, 1.32, 1.73];
  for (const y of levels) U.boxAt(g, -W / 2 + t, y, 0.012, W / 2 - t, y + 0.025, D, wood);
  const bayW = W / 2 - t - 0.015, zc = D - 0.13;
  const bay = side => side * (0.015 + bayW / 2);
  let k = 0;
  const row = (side, y, len, off = 0, o = {}) => P.books(Object.assign({ parent: g, length: len, depth: 0.2, position: [bay(side) + off, y, zc], seed: seed * 17 + (k++) }, o));
  const L = levels.map(y => y + 0.025);
  // bottom: basket + tall atlases
  P.basket({ parent: g, position: [bay(-1) - 0.2, L[0], D * 0.52], radius: 0.16, height: 0.22, oval: 0.8, contents: 'blanket' });
  row(-1, L[0], 0.42, 0.18, { minH: 0.24, maxH: 0.31 });
  row(1, L[0], bayW - 0.05, 0, { minH: 0.22, maxH: 0.3 });
  row(-1, L[1], bayW - 0.04);
  row(1, L[1], 0.52, -0.14);
  P.frame({ parent: g, position: [bay(1) + 0.28, L[1], D * 0.55], rotationY: -0.25, w: 0.13, h: 0.18, seed: seed + 1 });
  row(-1, L[2], 0.44, -0.18);
  P.bookStack({ parent: g, count: 3, position: [bay(-1) + 0.2, L[2], D * 0.55], rotationY: 0.2, seed: seed + 2 });
  row(1, L[2], bayW - 0.04, 0, { fill: 0.9 });
  row(-1, L[3], bayW - 0.06);
  row(1, L[3], 0.5, -0.16);
  P.plant({ parent: g, type: 'succulent', position: [bay(1) + 0.27, L[3], D * 0.55], seed: seed + 3 });
  row(-1, L[4], 0.42, 0.2);
  P.vase({ parent: g, position: [bay(-1) - 0.24, L[4], D * 0.55], flowers: 'lavender', height: 0.16, color: 0x6f8a9a, seed: seed + 4 });
  row(1, L[4], bayW - 0.05, 0, { fill: 0.85 });
  P.plant({ parent: g, type: 'pothos', position: [W * 0.28, H + 0.04, D * 0.5], seed: seed + 5 });
  P.bookStack({ parent: g, count: 2, position: [-W * 0.3, H + 0.04, D * 0.5], rotationY: -0.15, seed: seed + 6 });
  U.blobShadow(g, 0, 0, D * 0.5, W + 0.15, D + 0.2, 0.35);
  return g;
}

    updatePx();

  update(dt, t, C) {
    if (!st.ready) return;
    // skip the baked meshes where the room cannot be seen (lights stay → no recompiles): from the loft, and from the
    // study while both study doors are shut (through D3 + the D1 archway a sliver of the living room shows)
    const cp = C.camera.position;
    const hd = C.house && C.house.doors;
    const inStudy = cp.x > 2.0 && cp.z < -0.7 && hd && doorShut(hd.kitchenStudy) && doorShut(hd.hallStudy);
    st.S.visible = !(cp.x > -7 && cp.x < 7 && cp.z > -5 && cp.z < 5) || (cp.y < 3.8 && !inStudy);
    const U = C.util, f = st.fire;
    if (f.roar > 0) { f.roar -= dt; if (f.roar <= 0 && f.target > 1.2) { f.target = 1; C.emit('fire', { level: 1 }); } }
    const rate = f.target > f.level ? 0.9 : 0.22;
    f.level = U.damp(f.level, f.target, rate, dt);
    if (Math.abs(f.level - f.target) < 0.003) f.level = f.target;
    if (f.target <= 0) f.out += dt; else f.out = 0;
    C.env.fireLevel = f.level;
    const lv = Math.min(f.level, 1.6);
    const n = U.noise2D(t * 5.3, 0.7) * 0.6 + U.noise2D(t * 13.1, 3.1) * 0.4;
    st.fireLight.intensity = FIRE_CD * lv * (1 + 0.22 * n);
    st.fireLight.position.y = 0.6 + 0.035 * n;
    st.flameU.uTime.value = t;
    st.flameU.uLevel.value = lv;
    const after = f.target <= 0 ? 0.35 * Math.exp(-f.out / 45) : 0;
    st.emberMat.emissiveIntensity = 0.1 + after + 0.85 * Math.min(lv, 1.2) * (0.9 + 0.12 * n);
    st.fireGlow.material.opacity = 0.24 * Math.min(1, lv) * (0.9 + 0.15 * n);
    st.fireGlow.visible = lv > 0.02;
    C.camera.getWorldPosition(_cam);
    for (let i = 0; i < st.flames.length; i++) {
      const m = st.flames[i];
      m.rotation.y = Math.atan2(_cam.x - m.position.x, _cam.z - m.position.z);
      m.visible = lv > 0.02;
    }
    if (st.playing) st.record.rotation.y -= dt * 3.49;
    const want = st.playing ? 0.45 : 0;
    if (st.armAngle !== want) {
      st.armAngle = U.damp(st.armAngle, want, 4, dt);
      if (Math.abs(st.armAngle - want) < 0.002) st.armAngle = want;
      st.arm.rotation.y = st.armAngle;
    }
  },
});

</script>
