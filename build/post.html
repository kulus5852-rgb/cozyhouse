      }
      strikePayload.strength = strength; strikePayload.distance = +distance.toFixed(2); strikePayload.dirX = dirX; strikePayload.dirZ = dirZ;
      C.emit('lightning', { strength, distance: strikePayload.distance, dirX, dirZ });
      return strikePayload;
    }
    function flashAt(t) {
      let f = 0;
      for (let i = 0; i < 4; i++) {
        const p = pulses[i];
        if (p.amp <= 0) continue;
        const dt = t - p.t0;
        if (dt < 0) continue;
        const v = p.amp * Math.min(1, dt / 0.015) * Math.exp(-dt / p.dur);
        if (v > f) f = v;
      }
      return f;
    }

    // =================================================================================================================
    // RAIN-ON-GLASS
    // =================================================================================================================
    const glassUni = {
      uTime: uni.time, uRain: uni.rain, uFlash: uni.flash, uFlashCol: uni.flashCol, uDay: uni.day,
      uZenith: uni.zenith, uHorizon: uni.horizon, uFogColor: uni.fogColor, uFogDensity: uni.fogDensity,
      uHaze: { value: new THREE.Color() }, uWarm: { value: new THREE.Color(0xffb46b) }, uIndoor: uni.indoor,
    };
    const glassMat = new THREE.ShaderMaterial({
      name: 'weather.glass',
      uniforms: glassUni,
      vertexShader: /* glsl */`
        varying vec3 vWP, vN, vT, vB;
        varying vec2 vP;
        varying float vSky;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vec3 n = normalize(mat3(modelMatrix) * normal);
          float sky = abs(n.y) > 0.3 ? 1.0 : 0.0;
          if (sky > 0.5) { if (n.y < 0.0) n = -n; }
          else if (dot(n.xz, wp.xz) < 0.0) n = -n;
          vec3 down = vec3(0.0, -1.0, 0.0) - n * (-n.y);
          down = length(down) > 1e-3 ? normalize(down) : vec3(0.0, 0.0, 1.0);
          vec3 tang = normalize(cross(n, down));
          vP = vec2(dot(wp.xyz, tang), -dot(wp.xyz, down));
          vWP = wp.xyz; vN = n; vT = tang; vB = -down; vSky = sky;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: /* glsl */`
        ${GLSL_HASH}
        uniform float uTime, uRain, uFlash, uDay, uFogDensity, uIndoor;
        uniform vec3 uFlashCol, uZenith, uHorizon, uFogColor, uHaze, uWarm;
        varying vec3 vWP, vN, vT, vB;
        varying vec2 vP;
        varying float vSky;
        #define S(a, b, t) smoothstep(a, b, t)
        float Saw(float b, float t) { return S(0.0, b, t) * S(1.0, b, t); }
        // running drops with trails (after BigWings' "Heartfelt"), uv in scaled metres
        vec2 DropLayer(vec2 uv, float t) {
          vec2 UV = uv;
          uv.y += t * 0.75;
          vec2 a = vec2(6.0, 1.0);
          vec2 grid = a * 2.0;
          vec2 id = floor(uv * grid);
          float colShift = hash11(id.x * 7.13 + 3.1);
          uv.y += colShift;
          id = floor(uv * grid);
          vec3 n = hash31(id.x * 35.2 + id.y * 2376.1);
          vec2 st = fract(uv * grid) - vec2(0.5, 0.0);
          float x = n.x - 0.5;
          float y = UV.y * 20.0;
          float wiggle = sin(y + sin(y));
          x += wiggle * (0.5 - abs(x)) * (n.z - 0.5);
          x *= 0.7;
          float ti = fract(t + n.z);
          y = (Saw(0.85, ti) - 0.5) * 0.9 + 0.5;
          vec2 p = vec2(x, y);
          float d = length((st - p) * a.yx);
          float mainDrop = S(0.4, 0.0, d);
          float r = sqrt(S(1.0, y, st.y));
          float cd = abs(st.x - x);
          float trail = S(0.23 * r, 0.15 * r * r, cd);
          float trailFront = S(-0.02, 0.02, st.y - y);
          trail *= trailFront * r * r;
          y = UV.y;
          y = fract(y * 10.0) + (st.y - 0.5);
          float dd = length(st - vec2(x, y));
          float droplets = S(0.3, 0.0, dd);
          float m = mainDrop + droplets * r * trailFront;
          // only a fraction of columns carry a running drop
          m *= step(n.y, 0.75);
          trail *= step(n.y, 0.75);
          return vec2(m, trail);
        }
        float StaticDrops(vec2 uv, float t, float splat) {
          vec2 id = floor(uv);
          uv = fract(uv) - 0.5;
          vec3 n = hash31(id.x * 107.45 + id.y * 3543.654);
          vec2 p = (n.xy - 0.5) * 0.7;
          float d = length(uv - p);
          float ph = fract(t + n.z);
          float fade = Saw(0.025, ph);
          float sz = fract(n.z * 10.0);
          float c = S(0.3, 0.0, d) * sz * fade;
          // skylight splats: a quick ring when the drop lands
          c += splat * S(0.05, 0.0, abs(d - ph * 9.0)) * S(0.04, 0.0, ph) * 0.8;
          return c;
        }
        vec2 Drops(vec2 uv, float t, float l0, float l1, float l2, float splat) {
          float s = StaticDrops(uv * 12.0, t * 0.35, splat) * l0 + StaticDrops(uv * 26.0 + 3.7, t * 0.5, splat) * l0 * 0.6;
          vec2 m1 = DropLayer(uv * 1.1, t) * l1;
          vec2 m2 = DropLayer(uv * 2.0 + 1.3, t * 1.1) * l2;
          float c = s + m1.x + m2.x;
          c = S(0.3, 1.0, c);
          return vec2(c, max(m1.y * l0, m2.y * l1));
        }
        void main() {
          vec3 N = normalize(vN);
          vec3 V = normalize(cameraPosition - vWP);
          float ndv = dot(N, V);
          float outside = step(0.0, ndv);
          float cosT = abs(ndv);
          float sky = vSky;
          float rain = uRain;
          float t = uTime * (sky > 0.5 ? 0.12 : 0.22) + 7.0;
          vec2 uv = vP * 2.4;
          float fw = length(fwidth(vP));
          float detail = 1.0 - S(0.003, 0.012, fw);
          float l0 = S(-0.5, 1.0, rain) * (sky > 0.5 ? 2.2 : 1.6);
          float l1 = S(0.25, 0.75, rain) * (sky > 0.5 ? 0.6 : 1.0);
          float l2 = S(0.0, 0.5, rain);
          float splat = sky * S(0.2, 0.8, rain);
          vec2 c = Drops(uv, t, l0, l1, l2, splat);
          vec2 e = vec2(0.004, 0.0);
          float cx = Drops(uv + e, t, l0, l1, l2, splat).x;
          float cy = Drops(uv + e.yx, t, l0, l1, l2, splat).x;
          vec2 grad = vec2(cx - c.x, cy - c.x) / e.x;
          float m = c.x * detail;
          float trail = c.y * detail;
          vec2 dn = grad * 0.35 * detail;
          float tilt = clamp(length(dn), 0.0, 1.0);
          // droplet surface normal facing the viewer
          vec3 Nv = N * (outside > 0.5 ? 1.0 : -1.0);
          vec3 nd = normalize(Nv * 1.0 - vT * dn.x * (outside > 0.5 ? 1.0 : -1.0) - vB * dn.y);
          // fine misting / micro droplets (average of what can't be resolved)
          float mist = vnoise(vP * 60.0) * 0.5 + vnoise(vP * 23.0) * 0.5;
          float fresnel = 0.04 + 0.96 * pow(1.0 - cosT, 5.0);
          vec3 prem; float alpha;
          float flash = uFlash;
          if (outside < 0.5) {
            // ---- seen from inside: dim blue-grey outdoors through a wet pane
            float hazeA = (0.09 + 0.1 * rain) * (1.0 - 0.65 * trail) * (0.8 + 0.4 * mist) + fresnel * 0.4;
            vec3 haze = uHaze;
            // droplets are little lenses: the bright sky appears inverted (bottom of the drop brighter)
            float lensY = clamp(0.5 - dn.y * 0.8, 0.0, 1.0);
            vec3 body = mix(uHaze * 0.55, uZenith * 1.6 + uHaze * 0.9, lensY);
            body = mix(body, uHaze * 0.35, tilt * 0.55);
            float dropA = 0.62 - 0.25 * lensY;
            alpha = mix(hazeA, dropA, m);
            prem = mix(haze * hazeA, body * dropA, m);
            // warm lamp glints from the room behind the viewer + faint room reflection at night
            vec3 L = normalize(V + vB * 0.9 + vT * 0.3);
            float sp = pow(max(dot(nd, L), 0.0), 60.0) * m;
            prem += uWarm * sp * (0.25 + 0.5 * (1.0 - uDay));
            prem += uWarm * 0.012 * (1.0 - uDay) * (1.0 - m);
          } else {
            // ---- seen from outside: dark, reflective glass with the lamp-lit room showing through
            vec3 R = reflect(-V, N);
            vec3 env = mix(uHorizon * 0.9, uZenith * 1.15, S(-0.05, 0.6, R.y));
            env = mix(uHorizon * 0.25, env, S(-0.25, 0.02, R.y));
            float refl = mix(0.12, 0.85, fresnel);
            float baseA = 0.18 + refl * 0.6;
            vec3 base = env * refl;
            float lensY = clamp(0.5 + dn.y * 0.8, 0.0, 1.0);
            vec3 body = mix(env * 0.35, env * 1.25 + uWarm * 0.05 * (1.0 - uDay), lensY);
            float dropA = 0.55;
            alpha = mix(baseA, dropA, m) + trail * 0.02;
            prem = mix(base, body * dropA, m);
            vec3 L = normalize(vec3(0.0, 1.0, 0.0) + V * 0.6);
            float sp = pow(max(dot(nd, L), 0.0), 50.0) * m;
            prem += (uZenith * 3.0 + vec3(0.03)) * sp;
          }
          // lightning lights up the pane and its drops
          prem += uFlashCol * flash * (0.05 + 0.4 * m + 0.1 * trail);
          alpha = clamp(alpha + flash * 0.05, 0.0, 1.0);
          // fog
          float dist = length(cameraPosition - vWP);
          float ff = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
          prem = mix(prem, uFogColor * alpha, ff);
          gl_FragColor = vec4(prem, alpha);
          ${OUT_CHUNKS}
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, premultipliedAlpha: true, fog: false,
      extensions: {},
    });
    const glassDone = new WeakSet();
    const glassList = [];
    function applyGlass(mesh) {
      if (!mesh || !mesh.isMesh || glassDone.has(mesh)) return false;
      glassDone.add(mesh);
      mesh.userData.origMaterial = mesh.material;
      if (mesh.geometry && !mesh.geometry.attributes.normal) mesh.geometry.computeVertexNormals();
      mesh.material = glassMat;
      mesh.userData.dynamic = true;
      glassList.push(mesh);
      return true;
    }
    let knownPanes = 0;
    function refreshGlass() {
      const panes = (C.house && C.house.glassPanes) || [];
      for (let i = 0; i < panes.length; i++) applyGlass(panes[i]);
      knownPanes = panes.length;
      return glassList.length;
    }
    refreshGlass();

    // =================================================================================================================
    // rain lights: outdoor point/spot lights make nearby rain glint (collected on 'ready')
    // =================================================================================================================
    const rainLights = [];
    function collectRainLights() {
      rainLights.length = 0;
      const cands = [];
      C.scene.traverse(o => {
        if (!(o.isPointLight || o.isSpotLight)) return;
        if (o.parent === C.camera || o.name === 'flashlight') return;
        o.getWorldPosition(_v1);
        if (C.world.indoorAmount(_v1.x, _v1.y, _v1.z) >= 1) return;
        cands.push({ light: o, pos: _v1.clone() });
      });
      cands.sort((a, b) => b.light.intensity - a.light.intensity);
      for (let i = 0; i < Math.min(4, cands.length); i++) rainLights.push(cands[i]);
    }

    // =================================================================================================================
    // presets / rain API
    // =================================================================================================================
    function setPreset(name, opts = {}) {
      if (!PRESETS[name]) return false;
      if (name === st.preset && !opts.force) return true;
      if (opts.instant) { st.blendFrom = name; st.preset = name; st.blend = 1; }
      else {
        // start the cross-fade from the currently displayed mix
        st.blendFrom = st.blend < 0.5 ? st.blendFrom : st.preset;
        st.preset = name; st.blend = 0;
      }
      env.preset = name;
      if (opts.instant) { blendPresets(); st.daylight = cur.daylight; }
      if (!opts.silent) C.hud.toast(PRESETS[name].toast, 2.6);
      C.emit('timeofday', { preset: name, daylight: PRESETS[name].daylight });
      return true;
    }
    function cycleTime() {
      const i = PRESET_ORDER.indexOf(st.preset);
      setPreset(PRESET_ORDER[(i + 1) % PRESET_ORDER.length]);
      return st.preset;
    }
    function setRain(level, opts = {}) {
      level = U.clamp(+level || 0, 0, 1);
      st.rainTarget = level;
      if (opts.instant) st.rain = level;
      if (!opts.silent) {
        const lv = RAIN_LEVELS.find(r => Math.abs(r.level - level) < 0.01);
        C.hud.toast(lv ? lv.toast : level <= 0 ? 'The rain stops' : `Rain ${(level * 100) | 0}%`, 2.6);
      }
      C.emit('rain', { level });
      return level;
    }
    function cycleRain() {
      const next = RAIN_LEVELS.find(r => r.level > st.rainTarget + 0.01) || RAIN_LEVELS[0];
      setRain(next.level);
      return next.name;
    }
    C.input.onKey('KeyT', () => cycleTime());
    C.input.onKey('KeyR', () => cycleRain());

    C.weather = {
      setPreset, cycleTime, setRain, cycleRain,
      lightning: (opts) => strike(opts || {}),
      setLightningEnabled(on) { st.lightningOn = !!on; if (on) st.nextStrike = C.time + 8 + rnd() * 10; },
      applyGlass, refreshGlass,
      get preset() { return st.preset; },
      get rain() { return st.rainTarget; },
      presets: PRESET_ORDER.slice(), rainLevels: RAIN_LEVELS.map(r => ({ name: r.name, level: r.level })),
      lights: { hemi, dir, window: windowLights },
      uniforms: uni, glassMaterial: glassMat, root,
    };
    C.debug.lightning = (opts) => strike(opts || { strength: 0.9, bolt: true });

    // ------------------------------------------------------------------ events
    C.on('teleport', () => { st.snapIndoor = true; });
    C.on('ready', () => {
      refreshGlass();
      collectRainLights();
      C.emit('timeofday', { preset: st.preset, daylight: PRESETS[st.preset].daylight });
      C.emit('rain', { level: st.rainTarget });
    });
    const qualityFactor = () => (C.settings.quality === 'low' ? 0.4 : C.settings.quality === 'medium' ? 0.75 : 1);

    // ------------------------------------------------------------------ per-frame scratch
    const eye = new THREE.Vector3();
    const tmpC = new THREE.Color();
    const velK = new THREE.Vector3();
    let frameCount = 0;

    this._frame = (dt, t) => {
      frameCount++;
      const p = C.player;
      if (p.mode === 'noclip') eye.copy(p.position);
      else if (p.mode === 'sit' && p.seat && p.seat.position) eye.set(p.seat.position[0], p.seat.position[1], p.seat.position[2]);
      else eye.set(p.position.x, p.position.y + p.eyeHeight, p.position.z);

      // ---- indoor amount
      const target = C.world.indoorAmount(eye.x, eye.y, eye.z);
      if (st.snapIndoor) { st.indoor = target; st.snapIndoor = false; }
      else st.indoor = U.damp(st.indoor, target, 3.5, dt);
      env.indoor = st.indoor;
      const ind = st.indoor;

      // ---- preset blend + daylight
      if (st.blend < 1) { st.blend = Math.min(1, st.blend + dt / 3.5); }
      blendPresets();
      st.daylight = cur.daylight;
      env.daylight = st.daylight;
      env.preset = st.preset;

      // ---- rain level (smoothed) + wind
      st.rain = U.damp(st.rain, st.rainTarget, 1.2, dt);
      if (Math.abs(st.rain - st.rainTarget) < 1e-3) st.rain = st.rainTarget;
      env.rain = st.rain;
      const r = st.rain;
      const windStrength = 0.3 + 1.6 * r * r;
      const gust = 0.75 + 0.45 * U.noise2D(t * 0.13, 3.7) + 0.25 * U.noise2D(t * 0.6, 9.1);
      const wa = 0.4 + 0.35 * U.noise2D(t * 0.02, 1.3);
      env.wind.x = Math.cos(wa) * windStrength * gust;
      env.wind.z = Math.sin(wa) * windStrength * gust;

      // ---- lightning
      if (st.lightningOn && r > 0.2 && t > st.nextStrike) {
        strike({});
        const rate = r > 0.9 ? 1 : r > 0.5 ? 0.45 : 0.15;
        st.nextStrike = t + (10 + rnd() * 26) / rate;
      }
      const flash = flashAt(t);
      env.lightningFlash = flash;
      uni.flash.value = flash;
      if (boltUntil > 0) {
        const vis = t < boltUntil + 0.1;
        bolt.visible = vis;
        boltMat.uniforms.uA.value = vis ? Math.min(1.2, flash * 1.4 + 0.15) * (0.6 + boltStrength * 0.6) : 0;
        if (!vis) boltUntil = -1;
      }

      // ---- fog
      const fogDen = U.lerp(cur.fogOut * (0.85 + 0.25 * r), cur.fogIn, ind);
      C.scene.fog.color.copy(cur.fog);
      C.scene.fog.density = fogDen;
      if (C.scene.background && C.scene.background.isColor) C.scene.background.copy(cur.horizon);
      uni.fogColor.value.copy(cur.fog);
      uni.fogDensity.value = fogDen;
      uni.day.value = st.daylight;
      uni.indoor.value = ind;
      uni.time.value = t % 3600;
      uni.rain.value = r;
      const cam = C.camera;
      uni.pix.value = 2 * Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2) / Math.max(1, C.renderer.domElement.height);

      // ---- lights
      const hemiK = U.lerp(1, INDOOR_HEMI, ind), dirK = U.lerp(1, INDOOR_DIR, ind);
      const flashK = U.lerp(1, 0.35, ind);
      hemi.color.copy(cur.hemiSky).lerp(uni.flashCol.value, Math.min(1, flash * 0.6));
      hemi.groundColor.copy(cur.hemiGround);
      hemi.intensity = cur.hemi * hemiK + flash * 2.2 * flashK;
      dir.color.copy(cur.dirColor).lerp(uni.flashCol.value, Math.min(1, flash));
      dir.intensity = cur.dir * dirK + flash * 5.0 * flashK;
      const fw = Math.min(1, flash * 2);
      dir.position.set(
        U.lerp(DIR_BASE.x, uni.flashDir.value.x * 12, fw),
        U.lerp(DIR_BASE.y, 8, fw),
        U.lerp(DIR_BASE.z, uni.flashDir.value.z * 12, fw));
      for (const l of windowLights) {
        l.color.copy(cur.winColor).lerp(uni.flashCol.value, Math.min(1, flash));
        l.intensity = cur.win * l.userData.k + flash * 6;
      }

      // ---- sky clouds drift
      const su = skyMat.uniforms;
      su.uOff1.value.x += env.wind.x * dt * 0.004; su.uOff1.value.y += env.wind.z * dt * 0.004;
      su.uOff2.value.x += env.wind.x * dt * 0.012; su.uOff2.value.y += env.wind.z * dt * 0.012;
      su.uOff3.value.x += env.wind.x * dt * 0.03; su.uOff3.value.y += env.wind.z * dt * 0.03;

      // ---- rain streaks
      const speed = U.lerp(4.5, 9.0, U.smoothstep(0.2, 1.0, r));
      const ru = rainMat.uniforms;
      for (let k = 0; k < 4; k++) {
        const sf = 0.85 + 0.1 * k;
        velK.set(env.wind.x * 0.9, -speed * sf, env.wind.z * 0.9).multiplyScalar(dt);
        const o = rainOffsets[k];
        o.add(velK);
        o.x = ((o.x % BOX.x) + BOX.x) % BOX.x; o.y = ((o.y % BOX.y) + BOX.y) % BOX.y; o.z = ((o.z % BOX.z) + BOX.z) % BOX.z;
      }
      ru.uDir.value.set(env.wind.x * 0.9, -speed, env.wind.z * 0.9).normalize();
      ru.uBottom.value = Math.max(GROUND_Y - 0.3, eye.y - 5.5);
      ru.uLen.value = speed * 0.05;
      ru.uWidth.value = U.lerp(0.006, 0.012, r);
      const bright = cur.rainBright;
      tmpC.copy(cur.rain).multiplyScalar(bright).lerp(uni.flashCol.value, Math.min(1, flash * 0.8));
      ru.uAmb.value.copy(tmpC);
      ru.uOpacity.value = U.lerp(0.3, 0.55, r) * U.lerp(1, 0.55, ind) * (1 + flash * 1.5);
      const countFrac = r <= 0.001 ? 0 : U.clamp(0.12 + r * 0.88, 0, 1);
      const rainCount = Math.floor(RAIN_MAX * countFrac * qualityFactor());
      rainGeo.setDrawRange(0, rainCount * 6);
      rain.visible = rainCount > 0;
      rain.renderOrder = ind > 0.75 ? -5 : 10;       // indoors: draw before the glass panes; outdoors: after them
      // outdoor lights that make rain glint
      for (let i = 0; i < 4; i++) {
        const rl = rainLights[i];
        if (rl && rl.light.visible && rl.light.intensity > 0) {
          rainLPos[i].copy(rl.pos);
          rainLCol[i].copy(rl.light.color).multiplyScalar(Math.sqrt(rl.light.intensity) * 0.02);
        } else { rainLPos[i].set(0, -999, 0); rainLCol[i].setRGB(0, 0, 0); }
      }

      // ---- drips & splashes
      const du = dripMat.uniforms;
      du.uAmb.value.copy(tmpC).multiplyScalar(1.3);
      du.uEave.value = r <= 0.001 ? -1 : U.clamp(0.15 + r * 0.95, 0, 1);
      du.uGush.value = r <= 0.001 ? -1 : U.clamp(0.25 + r * 0.8, 0, 1);
      const spu = splashMat.uniforms;
      spu.uAmb.value.copy(tmpC).multiplyScalar(0.8);
      spu.uRandom.value = r <= 0.001 ? -1 : U.clamp(r * 1.05, 0, 1) * qualityFactor();
      spu.uEave.value = du.uEave.value;
      spu.uGush.value = du.uGush.value;
      dripMesh.visible = splash.visible = r > 0.001;

      // ---- chimney smoke
      st.fire = U.damp(st.fire, env.fireLevel > 0 ? U.clamp(env.fireLevel, 0.3, 1) : 0, 0.5, dt);
      smokeMat.uniforms.uLevel.value = st.fire;
      smoke.visible = st.fire > 0.01;
      smokeWind.x = U.damp(smokeWind.x, env.wind.x * 0.6, 0.3, dt);
      smokeWind.y = U.damp(smokeWind.y, env.wind.z * 0.6, 0.3, dt);
      smokeMat.uniforms.uCol.value.copy(cur.cloudLight).multiplyScalar(1.05).lerp(cur.fog, 0.3);

      // ---- glass
      glassUni.uHaze.value.copy(cur.fog).multiplyScalar(0.8).lerp(cur.cloudLight, 0.3);
      if ((frameCount & 63) === 0) {
        const panes = C.house && C.house.glassPanes;
        if (panes && panes.length !== knownPanes) refreshGlass();
        for (let i = 0; i < rainLights.length; i++) rainLights[i].light.getWorldPosition(rainLights[i].pos);
      }
    };
  },
  update(dt, t) { if (this._frame) this._frame(dt, t); },
});

</script>
<script type="module" data-module="post">
// =====================================================================================================================
//  POST — post-processing pipeline (EffectComposer: MSAA HDR render → bloom → grade → output) + all UI overlays
//  (start screen, pause/settings menu, help overlay, fade-in, hints, fps counter).  SPEC §9 post, §3.1/§3.3/§3.9
// =====================================================================================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------------------------------------------------

// ---------------------------------------------------------------------------------------------------------------------
const BLOOM = { strength: 0.42, radius: 0.55, threshold: 1.05 };
const BLOOM_MAX_PIXELS = 1920 * 1080;        // bloom input is capped to this (mip0 = half of it) for hi-dpi screens
const GRADE = { split: 0.55, vignette: 0.26, grain: 0.010 };

// Colour grade — runs on the linear HDR image (before tone mapping in the OutputPass).
const GradeShader = {
  name: 'CozyGrade',
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uFlash: { value: 0 },
    uSplit: { value: GRADE.split },
    uVignette: { value: GRADE.vignette },
    uGrain: { value: GRADE.grain },
    uAspect: { value: 16 / 9 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime, uFlash, uSplit, uVignette, uGrain, uAspect;
    varying vec2 vUv;
    const vec3 LW = vec3(0.2126, 0.7152, 0.0722);
    float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main() {
      vec3 col = max(texture2D(tDiffuse, vUv).rgb, vec3(0.0));
      float lum = dot(col, LW);

      // split toning: cool shadows, warm highlights (luminance preserving)
      float tl = lum / (lum + 0.22);
      vec3 tint = mix(vec3(0.955, 0.99, 1.07), vec3(1.05, 1.0, 0.925), smoothstep(0.18, 0.72, tl));
      vec3 g = col * mix(vec3(1.0), tint, uSplit);
      col = g * (lum / max(dot(g, LW), 1e-6));

      // lightning: brief global lift with a cool tint
      col = col * (1.0 + 0.55 * uFlash) + uFlash * vec3(0.006, 0.009, 0.016);
      col *= mix(vec3(1.0), vec3(0.9, 0.97, 1.14), clamp(uFlash, 0.0, 1.0) * 0.7);

      // gentle vignette (slightly elliptical, softer on wide screens)
      vec2 d = (vUv - 0.5) * vec2(mix(1.0, uAspect, 0.55), 1.0);
      float r = length(d) * 1.35;
      col *= 1.0 - uVignette * smoothstep(0.38, 1.05, r);

      // film grain (monochrome, ~24 fps, perceptually even: scaled like a display-space delta), doubles as dither
      float fr = floor(uTime * 24.0);
      vec2 p = gl_FragCoord.xy + vec2(fr * 37.0, fr * 71.0);
      float n = hash12(p) + hash12(p + 17.31) - 1.0;
      lum = dot(col, LW);
      col += n * (uGrain * 2.2 * pow(lum + 1e-4, 0.55) + 0.0006) * (col + 0.02) / (lum + 0.02);

      gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
    }`,
};

// Bloom bright-pass replacement: only the energy ABOVE the threshold blooms (soft knee), 4-tap box downsample
// (stable tiny highlights like fairy-light bulbs), firefly clamp. Uses UnrealBloomPass' own uniform object.
const BRIGHT_FRAG = /* glsl */`
  uniform sampler2D tDiffuse;
  uniform float luminosityThreshold;
  uniform vec2 uTexel;
  varying vec2 vUv;
  vec3 bright(vec2 uv) {
    vec3 c = texture2D(tDiffuse, uv).rgb;
    float l = max(max(c.r, c.g), c.b);
    float t = luminosityThreshold, knee = t * 0.5;
    float s = clamp(l - t + knee, 0.0, 2.0 * knee);
    s = s * s / (4.0 * knee + 1e-4);
    return min(c * (max(s, l - t) / max(l, 1e-4)), vec3(16.0));
  }
  void main() {
    vec2 o = uTexel;
    vec3 c = bright(vUv + vec2(-o.x, -o.y)) + bright(vUv + vec2(o.x, -o.y)) + bright(vUv + vec2(-o.x, o.y)) + bright(vUv + vec2(o.x, o.y));
    gl_FragColor = vec4(c * 0.25, 1.0);
  }`;
const QUAD_VERT = /* glsl */`
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

// ---------------------------------------------------------------------------------------------------------------------
C.register({
  name: 'post',
  order: 90,

  init(C) {
    const S = this._s = {};
    // core checks C.ui at the end of boot to decide whether to install its own click-to-start fallback
    C.ui = C.ui || {};
    const AUTOSTART = C.params ? C.params.get('autostart') === '1' : /[?&]autostart=1/.test(location.search);
    S.autostart = AUTOSTART;

    try { buildUI(C, S); }
    catch (e) {
      recordError(C, 'init(ui)', e);
      // make sure the user can still get in
      const go = () => { C.renderer.domElement.removeEventListener('click', go); C.start(); };
      C.renderer.domElement.addEventListener('click', go);
    }
    try { buildPost(C, S); }
    catch (e) { recordError(C, 'init(post)', e); C.renderOverride = null; }
  },

  update(dt, t, C) {
    const S = this._s;
    if (!S) return;
    // fps counter (independent of core's F3 debug overlay)
    if (S.fpsEl) {
      const now = performance.now();
      S.fpsN++;
      if (now - S.fpsT >= 500) {
        const fps = S.fpsN * 1000 / (now - S.fpsT);
        S.fpsN = 0; S.fpsT = now;
        const dbg = C.hud && C.hud.el && C.hud.el.querySelector('.dbg');
        const coreShowing = dbg && dbg.style.display !== 'none';
        const want = !!C.settings.showFps && !coreShowing;
        if (want) S.fpsEl.textContent = fps.toFixed(0) + ' fps';
        setShown(S.fpsEl, want);
      }
    }
    // "click to look around" when playing without pointer lock (e.g. the browser refused an immediate re-lock)
    if (S.lookEl) {
      const st = C.state;
      const need = !S.autostart && !C.input.isTouch && st.started && !st.paused && !st.uiOpen && !C.input.pointerLocked;
      S.lookT = need ? (S.lookT || 0) + dt : 0;
      setShown(S.lookEl, S.lookT > 0.7);
    }
    if (S.tpauseEl) setShown(S.tpauseEl, C.input.isTouch && C.state.started && !C.state.paused && !C.state.uiOpen);
  },
});

function recordError(C, phase, e) {
  const entry = { module: 'post', phase, message: (e && e.message) || String(e), stack: e && e.stack ? String(e.stack).slice(0, 1500) : '' };
  if (C.debug && C.debug.errors) C.debug.errors.push(entry);
  console.error(`[COZY] post ${phase} error: ${entry.message}\n${entry.stack}`);
}

function setShown(el, on) {
  if (!el) return;
  if (on) { if (!el.classList.contains('show')) el.classList.add('show'); }
  else if (el.classList.contains('show')) el.classList.remove('show');
}

// =====================================================================================================================
//  Post-processing
// =====================================================================================================================
function buildPost(C, S) {
  const renderer = C.renderer;
  const size = renderer.getSize(new THREE.Vector2());
  const pr = renderer.getPixelRatio();
  const quality = () => C.settings.quality || 'high';

  // Main HDR target: half float, MSAA on medium/high (the canvas' antialias does not apply to render targets)
  const rtMain = new THREE.WebGLRenderTarget(Math.max(1, Math.round(size.x * pr)), Math.max(1, Math.round(size.y * pr)), {
    type: THREE.HalfFloatType, samples: quality() === 'low' ? 0 : 4,
  });
  rtMain.texture.name = 'post.main';
  const composer = new EffectComposer(renderer, rtMain);
  // second ping-pong target only receives the full-screen grade → no MSAA, no depth
  composer.renderTarget2.samples = 0;
  composer.renderTarget2.depthBuffer = false;
  composer.renderTarget2.texture.name = 'post.grade';

  const renderPass = new RenderPass(C.scene, C.camera);
  const bloom = new UnrealBloomPass(new THREE.Vector2(size.x, size.y), BLOOM.strength, BLOOM.radius, BLOOM.threshold);
  // cap bloom resolution on hi-dpi screens (it starts at half res and blurs heavily anyway)
  const bloomSetSize = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => {
    const s = Math.min(1, Math.sqrt(BLOOM_MAX_PIXELS / Math.max(1, w * h)));
    bloomSetSize(Math.max(4, Math.round(w * s)), Math.max(4, Math.round(h * s)));
    bloom.highPassUniforms.uTexel.value.set(1 / Math.max(1, w), 1 / Math.max(1, h));
  };
  bloom.highPassUniforms.uTexel = { value: new THREE.Vector2(1 / 1920, 1 / 1080) };
  bloom.materialHighPassFilter.dispose();
  bloom.materialHighPassFilter = new THREE.ShaderMaterial({
    name: 'post.bloomBright', uniforms: bloom.highPassUniforms, vertexShader: QUAD_VERT, fragmentShader: BRIGHT_FRAG,
    depthTest: false, depthWrite: false,
  });
  const grade = new ShaderPass(GradeShader);
  grade.material.name = 'post.grade';
  const output = new OutputPass();

  composer.addPass(renderPass);
  composer.addPass(bloom);
  composer.addPass(grade);
  composer.addPass(output);

  const gu = grade.uniforms;
  const _sz = new THREE.Vector2();
  let curW = -1, curH = -1, curPR = -1;
  function syncSize() {
    renderer.getSize(_sz);
    const p = renderer.getPixelRatio();
    if (_sz.x === curW && _sz.y === curH && p === curPR) return;
    curW = _sz.x; curH = _sz.y; curPR = p;
    composer._pixelRatio = p;                 // setPixelRatio() would resize twice
    composer.setSize(Math.max(1, curW), Math.max(1, curH));
    gu.uAspect.value = curW / Math.max(1, curH);
  }
  function applyQuality() {
    const q = quality();
    bloom.enabled = q !== 'low';
    const samples = q === 'low' ? 0 : 4;
    if (rtMain.samples !== samples) { rtMain.samples = samples; rtMain.dispose(); }
    syncSize();
  }

  let enabled = true;
  function render(dt) {
    syncSize();
    // the RenderPass draws into readBuffer — keep that the MSAA target (grade + output swap twice per frame)
    if (composer.readBuffer !== rtMain) composer.swapBuffers();
    gu.uTime.value = C.time % 1000;
    gu.uFlash.value = Math.min(1.5, Math.max(0, +C.env.lightningFlash || 0));
    composer.render(dt);
  }

  C.on('resize', syncSize);
  C.on('settings', applyQuality);
  applyQuality();

  // Compile the render-target program variants (no tone mapping, linear output) during core's boot compile instead of
  // on the first frame: we are the last module to init, and core calls renderer.compile() right after the inits.
  renderer.setRenderTarget(rtMain);
  C.on('ready', () => { if (renderer.getRenderTarget() === rtMain) renderer.setRenderTarget(null); });

  C.renderOverride = render;
  C.post = {
    composer, renderPass, bloom, grade, output, rtMain,
    get enabled() { return enabled; },
    setEnabled(on) { enabled = !!on; C.renderOverride = enabled ? render : null; },
    settings: { BLOOM, GRADE },
  };
  S.composer = composer;
}

// =====================================================================================================================
//  UI
// =====================================================================================================================
function buildUI(C, S) {
  const isTouch = !!(C.input && C.input.isTouch);
  const style = document.createElement('style');
  style.id = 'cozy-ui-css';
  style.textContent = CSS;
  document.head.appendChild(style);

  const root = document.createElement('div');
  root.id = 'cozy-ui';
  document.body.appendChild(root);
  const mk = (cls, html = '', tag = 'div') => { const el = document.createElement(tag); el.className = 'cz-layer ' + cls; el.innerHTML = html; root.appendChild(el); return el; };

  // ---------------------------------------------------------------- start screen
  const verb = isTouch ? 'Tap' : 'Click';
  const startControls = isTouch
    ? `<span>Left thumb to walk</span><span>Drag to look</span><span>Tap <b>Use</b> to interact</span>`
    : `<span>${keyCaps(['W', 'A', 'S', 'D'])} walk</span><span><kbd>Mouse</kbd> look</span><span><kbd>Shift</kbd> run</span>` +
      `<span><kbd>E</kbd> interact</span><span><kbd>F</kbd> flashlight</span><span><kbd>H</kbd> help</span><span><kbd>Esc</kbd> menu</span>`;
  const start = mk('cz-start', `
    <div class="cz-start-inner">
      ${HOUSE_SVG}
      <h1 class="cz-title">Rainy Day Cottage</h1>
      <div class="cz-rule"><span></span>✦<span></span></div>
      <p class="cz-sub">Put the kettle on. The fire is lit, the cat is asleep,<br>and the rain isn't going anywhere.</p>
      <div class="cz-cta">${verb} to step inside</div>
    </div>
    <div class="cz-start-foot"><button class="cz-link cz-open-settings" type="button">Settings</button></div>
    <div class="cz-controls">${startControls}</div>`);

  // ---------------------------------------------------------------- pause / settings
  const slider = (key, label, min, max, step) =>
    `<div class="cz-row"><label for="cz-${key}">${label}</label><input id="cz-${key}" type="range" min="${min}" max="${max}" step="${step}" data-key="${key}"><span class="cz-val" data-val="${key}"></span></div>`;
  const toggle = (key, label) =>
    `<div class="cz-row cz-tog"><span>${label}</span><label class="cz-switch"><input type="checkbox" data-key="${key}"><span></span></label></div>`;
  const pause = mk('cz-pause', `
    <div class="cz-panel" role="dialog" aria-label="Paused">
      <div class="cz-head">
        <div><h2 class="cz-ptitle">Paused</h2><p class="cz-psub">Take your time — the rain will wait.</p></div>
        <button class="cz-btn cz-resume" type="button">Resume</button>
      </div>
      <div class="cz-cols">
        <section>
          <h3>Sound</h3>
          ${slider('masterVolume', 'Master', 0, 1, 0.01)}
          ${slider('musicVolume', 'Music', 0, 1, 0.01)}
          ${slider('ambienceVolume', 'Ambience', 0, 1, 0.01)}
          ${slider('sfxVolume', 'Effects', 0, 1, 0.01)}
          <h3>Controls</h3>
          ${slider('mouseSensitivity', 'Mouse speed', 0.2, 3, 0.05)}
          ${toggle('invertY', 'Invert vertical look')}
          <h3>Display</h3>
          ${slider('fov', 'Field of view', 55, 100, 1)}
          <div class="cz-row cz-tog"><span>Quality</span><span class="cz-seg" data-seg="quality"><button type="button" data-v="low">Low</button><button type="button" data-v="medium">Medium</button><button type="button" data-v="high">High</button></span></div>
          ${toggle('headBob', 'Head bob')}
          ${toggle('showFps', 'Show FPS')}
        </section>
        <section>
          <h3>${isTouch ? 'Touch controls' : 'Keys'}</h3>
          ${keyRows(isTouch ? TOUCHMAP : KEYMAP)}
          <div class="cz-note">Things to try: light the fire, put the kettle on, play a record, curl up on the window seat, and find the cat.</div>
        </section>
      </div>
    </div>`);

  // ---------------------------------------------------------------- help overlay (never takes pointer events)
  const help = mk('cz-help', `<h2>Around the cottage</h2>${keyRows(isTouch ? TOUCHMAP : KEYMAP)}
    <div class="cz-foot">Press <kbd>H</kbd> to close</div>`);

  // ---------------------------------------------------------------- small overlays
  const fade = mk('cz-fade');
  const hint = mk('cz-hint', isTouch
    ? 'Left thumb to walk<span class="sep">·</span>drag to look<span class="sep">·</span>tap Use to interact'
    : `${keyCaps(['W', 'A', 'S', 'D'])} to walk<span class="sep">·</span><kbd>E</kbd> to interact<span class="sep">·</span><kbd>H</kbd> for help`);
  const look = mk('cz-look', 'Click to look around');
  const fps = mk('cz-fps');
  const tpause = mk('cz-tpause', '❚❚', 'button');
  S.fpsEl = fps; S.fpsN = 0; S.fpsT = performance.now();
  S.lookEl = look; S.tpauseEl = tpause;

  // ---------------------------------------------------------------- state
  let pauseMode = 'pause';      // 'pause' (in game) | 'settings' (opened from the start screen)
  let pauseOpenedAt = 0;
  let hintTimer = 0, hintShown = false;
  const isShown = el => el.classList.contains('show');

  function refreshSettings() {
    const s = C.settings;
    pause.querySelectorAll('input[type=range]').forEach(inp => {
      const k = inp.dataset.key;
      if (document.activeElement !== inp || +inp.value !== +s[k]) inp.value = s[k];
      updateSliderLook(inp);
    });
    pause.querySelectorAll('input[type=checkbox]').forEach(inp => { inp.checked = !!s[inp.dataset.key]; });
    pause.querySelectorAll('.cz-seg[data-seg=quality] button').forEach(b => b.classList.toggle('on', b.dataset.v === s.quality));
  }
  function fmt(k, v) {
    if (k === 'fov') return Math.round(v) + '°';
    if (k === 'mouseSensitivity') return (+v).toFixed(2) + '×';
    return Math.round(v * 100) + '%';
  }
  function updateSliderLook(inp) {
    const min = +inp.min, max = +inp.max, v = +inp.value;
    inp.style.setProperty('--p', ((v - min) / (max - min) * 100).toFixed(1) + '%');
    const lab = pause.querySelector(`[data-val="${inp.dataset.key}"]`);
    if (lab) lab.textContent = fmt(inp.dataset.key, v);
  }
  pause.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => { updateSliderLook(inp); C.setSetting(inp.dataset.key, +inp.value); });
    inp.addEventListener('keydown', e => { if (e.code !== 'Escape') e.stopPropagation(); });
  });
  pause.querySelectorAll('input[type=checkbox]').forEach(inp => {
    inp.addEventListener('change', () => C.setSetting(inp.dataset.key, !!inp.checked));
  });
  pause.querySelectorAll('.cz-seg[data-seg=quality] button').forEach(b => {
    b.addEventListener('click', () => { C.setSetting('quality', b.dataset.v); refreshSettings(); });
  });

  // ---------------------------------------------------------------- show / hide
  function showStart() {
    setShown(pause, false); setShown(help, false);
    setShown(start, true);
  }
  function showPause(mode = 'pause') {
    pauseMode = mode;
    pause.querySelector('.cz-ptitle').textContent = mode === 'settings' ? 'Settings' : 'Paused';
    pause.querySelector('.cz-psub').textContent = mode === 'settings' ? 'Make yourself comfortable.' : 'Take your time — the rain will wait.';
    pause.querySelector('.cz-resume').textContent = mode === 'settings' ? 'Back' : 'Resume';
    refreshSettings();
    setShown(help, false); setShown(start, false);
    setShown(pause, true);
    pauseOpenedAt = performance.now();
    C.state.uiOpen = true;
  }
  function hidePause() {
    if (isShown(pause)) setShown(pause, false);
    C.state.uiOpen = false;
  }
  function showHelp() { setShown(help, true); }
  function hideHelp() { setShown(help, false); }
  function toggleHelp() { setShown(help, !isShown(help)); }
  function hideAll() {
    setShown(start, false); setShown(help, false);
    hidePause();
  }

  // ---------------------------------------------------------------- actions (all inside the user gesture)
  const blurActive = () => { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); };
  function doStart() {
    if (!isShown(start)) return;
    blurActive();
    setShown(start, false);
    if (C.state.started) C.resume(); else C.start();
  }
  function doResume() {
    blurActive();
    if (pauseMode === 'settings') { hidePause(); showStart(); return; }
    hidePause();
    C.resume();
  }
  start.addEventListener('click', doStart);
  start.querySelector('.cz-open-settings').addEventListener('click', e => { e.stopPropagation(); showPause('settings'); });
  pause.querySelector('.cz-resume').addEventListener('click', doResume);
  tpause.addEventListener('click', () => { if (C.state.started && !C.state.paused) C.pause(); });
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (isShown(pause) && e.code === 'Escape') {
      if (performance.now() - pauseOpenedAt < 350) return;   // same Esc that just released the pointer lock
      e.preventDefault(); doResume();
    } else if (isShown(start) && !isShown(pause) && (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter')) {
      e.preventDefault(); doStart();
    }
  });

  // ---------------------------------------------------------------- events
  C.input.onKey('KeyH', () => toggleHelp());
  C.on('start', () => {
    hideAll();
    if (S.autostart) return;
    // gentle fade in from black
    fade.classList.add('show');
    void fade.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => setShown(fade, false)));
    if (!hintShown) {
      hintShown = true;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        setShown(hint, true);
        hintTimer = setTimeout(() => setShown(hint, false), 6500);
      }, 1400);
    }
  });
  C.on('pause', () => { hideHelp(); setShown(hint, false); showPause('pause'); });
  C.on('resume', () => hideAll());
  C.on('settings', () => { if (isShown(pause)) refreshSettings(); });

  Object.assign(C.ui, {
    el: root,
    showStart, showPause: () => showPause('pause'), showSettings: () => showPause('settings'),
    showHelp, hideHelp, toggleHelp, hideAll,
    isOpen: () => isShown(start) || isShown(pause),
  });

  if (!S.autostart) showStart();
}

</script>
<script type="module" data-module="extra:post_lamps.js">
// Scratch (NOT product): stand-in living-room lighting for tuning post.js in the real house.
import * as THREE from 'three';
const C = window.COZY;
C.register({
  name: 'post_lamps', order: 61,
  init(C) {
    if (!C.props || !C.props.lamp) return;
    const root = new THREE.Group(); root.name = 'post_lamps'; C.scene.add(root);
    const U = C.util;
    C.props.lamp({ id: 't_floor', type: 'floor', position: [-5.9, 0, 4.2], parent: root, room: 'living' });
    U.box(root, 0.5, 0.6, 0.5, C.mat('woodMedium'), -1.0, 0.3, 4.3);
    C.props.lamp({ id: 't_table', type: 'table', position: [-1.0, 0.6, 4.3], parent: root, room: 'living' });
    U.box(root, 1.2, 0.45, 0.6, C.mat('woodDark'), -3.2, 0.225, 2.5);
    if (C.props.candle) { C.props.candle({ position: [-3.4, 0.45, 2.4], parent: root }); C.props.candle({ position: [-3.0, 0.45, 2.6], parent: root, height: 0.1 }); }
    C.props.lamp({ id: 't_pend', type: 'pendant', position: [-3.4, 2.8, -1.5], parent: root, room: 'kitchen' });
    // fake fire
    const fire = U.stdMat(0x000000, 1, 0, { emissive: 0xff7a2a, emissiveIntensity: 3 });
    U.sphere(root, 0.16, fire, -6.45, 0.3, 2.5, { sy: 1.5 });
    const fl = new THREE.PointLight(0xff8a3d, 35, 0, 2); fl.position.set(-6.25, 0.55, 2.5); root.add(fl);
    const fg = U.glowSprite(0xff8a3d, 1.0, 0.35); fg.position.set(-6.3, 0.45, 2.5); root.add(fg);
  },
});

</script>
<script type="module" data-module="boot">
if (window.COZY && typeof window.COZY.boot === 'function') { window.COZY.boot(); } else { window.__COZY_BOOT_FAILED = true; const el = document.getElementById('boot-loading'); if (el) el.querySelector('.msg').textContent = 'Engine failed to start (core module missing or broken).'; }
</script>
